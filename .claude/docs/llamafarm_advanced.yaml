version: v1
name: sbir-proposal-generator
namespace: default

# Runtime model configuration
runtime:
  default_model: main
  models:
    # Main chat model - OpenAI
    - name: main
      provider: openai
      model: gpt-5-nano
      base_url: https://api.openai.com/v1
      api_key: sk-proj-

    # Opportunity grader - fast evaluation
    - name: opportunity_grader
      provider: openai
      model: gpt-5-nano
      base_url: https://api.openai.com/v1
      api_key: sk-proj-

    # Section drafter with tools
    - name: section_drafter
      provider: openai
      model: gpt-5-nano
      base_url: https://api.openai.com/v1
      api_key: sk-proj-
      tool_call_strategy: native_api
      tools:
        - type: function
          name: query_rag
          description: Search past proposals for relevant content
          parameters:
            type: object
            required: [query]
            properties:
              query:
                type: string
                description: Search query for past proposals
              top_k:
                type: integer
                description: Number of results to return (default 5)

        - type: function
          name: get_company_info
          description: Get company profile information
          parameters:
            type: object
            properties:
              section:
                type: string
                description: Specific section to retrieve (capabilities, team, past_performance)

        - type: function
          name: get_requirement_details
          description: Get details about a specific requirement
          parameters:
            type: object
            required: [requirement_id]
            properties:
              requirement_id:
                type: string
                description: The requirement ID (e.g., REQ-1.1)

        - type: function
          name: get_opportunity_qas
          description: Get Q&As from the opportunity (DSIP topics have clarifying Q&As)
          parameters:
            type: object
            required: [opportunity_id]
            properties:
              opportunity_id:
                type: integer
                description: The opportunity database ID

        - type: function
          name: get_attachment_content
          description: Get parsed text from downloaded RFP attachments
          parameters:
            type: object
            required: [attachment_id]
            properties:
              attachment_id:
                type: integer
                description: The attachment database ID

    # Criteria extractor with tools
    - name: criteria_extractor
      provider: openai
      model: gpt-5-nano
      base_url: https://api.openai.com/v1
      api_key: sk-proj-
      tool_call_strategy: native_api
      tools:
        - type: function
          name: extract_requirements
          description: Extract mandatory requirements from RFP text
          parameters:
            type: object
            required: [text]
            properties:
              text:
                type: string
                description: RFP text to extract requirements from

        - type: function
          name: extract_format
          description: Extract format requirements (page limits, fonts, margins)
          parameters:
            type: object
            required: [text]
            properties:
              text:
                type: string
                description: RFP text to extract format from

        - type: function
          name: identify_scoring
          description: Identify evaluation criteria and scoring
          parameters:
            type: object
            required: [text]
            properties:
              text:
                type: string
                description: RFP text to identify scoring criteria from

    # Section editor for chat-based editing
    - name: section_editor
      provider: openai
      model: gpt-5-nano
      base_url: https://api.openai.com/v1
      api_key: sk-proj-

    # Section evaluator - scores and critiques sections
    - name: section_evaluator
      provider: openai
      model: gpt-5-mini
      base_url: https://api.openai.com/v1
      api_key: sk-proj-
      tool_call_strategy: native_api
      tools:
        - type: function
          name: check_facts
          description: Verify facts against company profile data
          parameters:
            type: object
            required: [claims]
            properties:
              claims:
                type: array
                items:
                  type: string
                description: List of factual claims to verify

        - type: function
          name: get_company_profile
          description: Get verified company profile data for fact-checking
          parameters:
            type: object
            properties:
              sections:
                type: array
                items:
                  type: string
                description: Sections to retrieve (team, capabilities, past_performance, products)

    # Section reviser - revises based on feedback with web research
    - name: section_reviser
      provider: openai
      model: gpt-5-mini
      base_url: https://api.openai.com/v1
      api_key: sk-proj-
      tool_call_strategy: native_api
      tools:
        - type: function
          name: web_search
          description: Search the web for information to support revisions
          parameters:
            type: object
            required: [query]
            properties:
              query:
                type: string
                description: Search query for finding supporting information

        - type: function
          name: fetch_url
          description: Fetch content from a specific URL
          parameters:
            type: object
            required: [url]
            properties:
              url:
                type: string
                description: URL to fetch content from

        - type: function
          name: query_rag
          description: Search past proposals and company docs for relevant content
          parameters:
            type: object
            required: [query]
            properties:
              query:
                type: string
                description: Search query
              database:
                type: string
                description: Database to search (proposals, company_docs)

    # Problem/Solution generator for proposals
    - name: problem_solution_generator
      provider: openai
      model: gpt-5-mini
      base_url: https://api.openai.com/v1
      api_key: sk-proj-
      tool_call_strategy: native_api
      tools:
        - type: function
          name: get_opportunity_details
          description: Get full opportunity details including description and requirements
          parameters:
            type: object
            required: [opportunity_id]
            properties:
              opportunity_id:
                type: integer
                description: Opportunity ID

        - type: function
          name: get_company_capabilities
          description: Get company capabilities and products relevant to problem
          parameters:
            type: object
            properties:
              focus_areas:
                type: array
                items:
                  type: string
                description: Technical areas to focus on

        - type: function
          name: search_similar_solutions
          description: Search past proposals for similar problem/solution approaches
          parameters:
            type: object
            required: [problem_keywords]
            properties:
              problem_keywords:
                type: array
                items:
                  type: string
                description: Keywords describing the problem domain

    # Product extractor - extracts product info from website
    - name: product_extractor
      provider: openai
      model: gpt-5-mini
      base_url: https://api.openai.com/v1
      api_key: sk-proj-

    # Reranker model (via universal-runtime)
    - name: reranker
      provider: universal
      model: cross-encoder/ms-marco-MiniLM-L-6-v2
      base_url: http://127.0.0.1:11540/v1

    # Query decomposer for multi-turn RAG
    - name: query_decomposer
      provider: openai
      model: gpt-5-nano
      base_url: https://api.openai.com/v1
      api_key: sk-proj-

    # Website extractor - extracts company info from website content
    # Uses RAG to enrich with existing company docs
    - name: website_extractor
      provider: openai
      model: gpt-5-nano
      base_url: https://api.openai.com/v1
      api_key: sk-proj-

# RAG configuration
rag:
  databases:
    # Main proposals database
    - name: proposals_db
      type: ChromaStore
      config:
        collection_name: proposals
        distance_function: cosine
      embedding_strategies:
        - name: default_embeddings
          type: UniversalEmbedder
          priority: 0
          config:
            model: sentence-transformers/all-MiniLM-L6-v2
            dimension: 384
            batch_size: 16
            timeout: 60
            auto_pull: true
      retrieval_strategies:
        - name: basic_search
          type: BasicSimilarityStrategy
          config:
            distance_metric: cosine
            top_k: 10
          default: false
        - name: reranked_search
          type: CrossEncoderRerankedStrategy
          config:
            model_name: reranker
            initial_k: 30
            final_k: 4
            base_strategy: BasicSimilarityStrategy
            base_strategy_config:
              distance_metric: cosine
            relevance_threshold: 0.0
            timeout: 60
          default: true
      default_embedding_strategy: default_embeddings
      default_retrieval_strategy: reranked_search

    # Company marketing materials
    - name: company_docs
      type: ChromaStore
      config:
        collection_name: company_docs
        distance_function: cosine
      embedding_strategies:
        - name: default_embeddings
          type: UniversalEmbedder
          priority: 0
          config:
            model: sentence-transformers/all-MiniLM-L6-v2
            dimension: 384
            batch_size: 16
            timeout: 60
            auto_pull: true
      retrieval_strategies:
        - name: basic_search
          type: BasicSimilarityStrategy
          config:
            distance_metric: cosine
            top_k: 10
          default: true
      default_embedding_strategy: default_embeddings
      default_retrieval_strategy: basic_search

  # Data processing strategies for document ingestion
  data_processing_strategies:
    # Default processor with basic parsing
    - name: default
      description: Basic document processing
      parsers:
        - type: PDFParser_PyPDF2
          file_include_patterns:
            - "*.pdf"
            - "*.PDF"
          priority: 10
          config:
            chunk_size: 1500
            chunk_overlap: 200
            chunk_strategy: paragraphs
            extract_metadata: true
            combine_pages: false
        - type: TextParser_Python
          file_include_patterns:
            - "*.md"
            - "*.txt"
            - "*.markdown"
          priority: 10
          config:
            chunk_size: 1500
            chunk_overlap: 200
            chunk_strategy: sentences
            encoding: utf-8
            extract_metadata: true

    # Enhanced proposal processor with semantic chunking and extraction
    - name: proposal_processor
      description: Process proposal documents with semantic chunking
      parsers:
        # PDF parsing with LlamaIndex (semantic chunking, table extraction)
        - type: PDFParser_LlamaIndex
          file_include_patterns:
            - "*.pdf"
            - "*.PDF"
          priority: 10
          config:
            chunk_strategy: semantic
            chunk_size: 1500
            chunk_overlap: 200
            extract_metadata: true
            extract_tables: true
        # Fallback PDF parser
        - type: PDFParser_PyPDF2
          file_include_patterns:
            - "*.pdf"
            - "*.PDF"
          priority: 50
          config:
            chunk_size: 1500
            chunk_overlap: 200
            chunk_strategy: paragraphs
            extract_metadata: true
            combine_pages: false
        # Word document parsing
        - type: DocxParser_LlamaIndex
          file_include_patterns:
            - "*.docx"
            - "*.DOCX"
            - "*.doc"
            - "*.DOC"
          priority: 10
          config:
            chunk_size: 1500
            chunk_overlap: 200
            extract_metadata: true
            extract_tables: true
        # Text/Markdown parsing
        - type: TextParser_Python
          file_include_patterns:
            - "*.md"
            - "*.txt"
            - "*.markdown"
          priority: 10
          config:
            chunk_size: 1500
            chunk_overlap: 200
            chunk_strategy: sentences
            encoding: utf-8
            extract_metadata: true
      extractors:
        # Keyword extraction with YAKE (better than RAKE for technical docs)
        - type: KeywordExtractor
          file_include_patterns:
            - "*"
          priority: 10
          config:
            algorithm: yake
            max_keywords: 15
            min_keyword_length: 3
        # Named entity extraction
        - type: EntityExtractor
          file_include_patterns:
            - "*"
          priority: 20
          config:
            entity_types:
              - PERSON
              - ORG
              - GPE
              - DATE
              - PRODUCT
              - MONEY
              - PERCENT
            min_entity_length: 2
            use_fallback: true

# Datasets for document collections (TOP LEVEL, not inside rag)
datasets:
  # Past proposals
  - name: proposals
    data_processing_strategy: proposal_processor
    database: proposals_db

  # Company marketing and capabilities
  - name: marketing
    data_processing_strategy: default
    database: company_docs

  # RFP/Opportunity attachments
  - name: opportunities
    data_processing_strategy: proposal_processor
    database: proposals_db

# Prompts for various agents
prompts:
  # Planner - RFP analysis and requirement extraction
  - name: planner_prompt
    messages:
      - role: system
        content: |
          You are a Proposal Architect. Your job is to read an RFP document and extract a COMPREHENSIVE analysis:
          1. RFP OVERVIEW (summary, topics, phases, key info)
          2. SUBMISSION FORMAT REQUIREMENTS (page limits, required sections, volumes)
          3. GUIDING QUESTIONS (decisions the proposer must make)
          4. TECHNICAL REQUIREMENTS (grouped by topic/track)

          Output ONLY valid JSON with this structure:
          {
            "overview": { "title": "", "organization": "", "type": "", "summary": "", "key_dates": {}, "phases": [], "topics": [] },
            "guiding_questions": [],
            "format": { "page_limit": null, "required_sections": [], "deliverables": [] },
            "requirements": []
          }

  # Outliner - Proposal structure generation
  - name: outliner_prompt
    messages:
      - role: system
        content: |
          You are a Proposal Document Architect creating professional proposal outlines.

          Use proper hierarchical numbering:
          - Level 1: Roman numerals (I, II, III)
          - Level 2: Capital letters (A, B, C)
          - Level 3: Arabic numbers (1, 2, 3)

          Section types: narrative, table, list, appendix

          Output JSON:
          {
            "outline": [
              {"section_name": "", "section_type": "narrative", "order_index": 1, "parent_id": null, "requirements": [], "rationale": ""}
            ]
          }

  # Section drafter - Section content writing
  - name: section_drafter_prompt
    messages:
      - role: system
        content: |
          You are a Proposal Writer drafting professional proposal sections.

          Guidelines:
          - Write in professional, confident tone
          - Address all mapped requirements explicitly
          - Include specific metrics and evidence where possible
          - Use the RAG context for examples and language from past successful proposals
          - Include Q&A clarifications as context when available
          - Respect word limits

          You have access to tools:
          - query_rag: Search past proposals for relevant content
          - get_company_info: Get company capabilities, team, past performance
          - get_requirement_details: Get specific requirement text
          - get_opportunity_qas: Get Q&As from DSIP topics
          - get_attachment_content: Get parsed RFP attachment text

          For each section, use tools to gather context, then draft professional content.

  # Fit analyzer - Company/RFP fit scoring
  - name: fit_analyzer_prompt
    messages:
      - role: system
        content: |
          You are a Proposal Fit Analyzer. Evaluate how well a company matches an opportunity.

          Consider:
          - Technical capability alignment
          - Past performance relevance
          - Team expertise match
          - Industry/domain experience
          - NAICS/PSC code match
          - Set-aside eligibility

          Output JSON:
          {
            "fit_score": 0-100,
            "strengths": [],
            "gaps": [],
            "recommendations": [],
            "go_no_go": "go" | "no-go" | "conditional"
          }

  # Opportunity grader - Quick opportunity grading
  - name: opportunity_grader_prompt
    messages:
      - role: system
        content: |
          You are an Opportunity Grader. Quickly evaluate if an opportunity is a good fit.

          Score 0-100 based on:
          - Technical alignment (40%)
          - Past performance fit (25%)
          - Resource availability (20%)
          - Win probability (15%)

          Output JSON:
          {
            "score": 0-100,
            "reasoning": "Brief explanation",
            "keywords_matched": [],
            "potential_gaps": [],
            "recommendation": "pursue" | "review" | "skip"
          }

  # Website scraper - Company info extraction
  - name: website_scraper_prompt
    messages:
      - role: system
        content: |
          You are an expert business analyst extracting company information from website content.

          Your job is to create a COMPREHENSIVE company profile. Even if the website content is limited,
          you should INFER and EXPAND based on context clues and industry knowledge.

          IMPORTANT RULES:
          1. NEVER return empty arrays - always provide at least 3-5 items per category
          2. For capabilities: Include both EXPLICIT and INFERRED capabilities
          3. For industries: Include primary AND related industries
          4. For summary: Write a BRIEF 1-2 sentence elevator pitch/tagline
          5. For description: Write a DETAILED 3-5 paragraph description covering technology, markets, and differentiators
          6. Be GENEROUS with inferences

          Output ONLY valid JSON with this EXACT structure:
          {
            "company_name": "Full Company Name",
            "summary": "Brief 1-2 sentence elevator pitch or tagline",
            "description": "Detailed 3-5 paragraph company description covering: what the company does, their technology and approach, target markets, key differentiators, and value proposition. This should be comprehensive enough for use in proposals.",
            "capabilities": ["capability 1", "capability 2", "capability 3", "capability 4", "capability 5"],
            "industries": ["primary industry", "secondary industry", "related industry"],
            "keywords": ["tech keyword 1", "product name", "technology", "methodology"],
            "products_services": ["main product/service 1", "main product/service 2"],
            "strengths": ["key strength 1", "key strength 2", "key strength 3"],
            "team_info": "Leadership/team information or inferred company size/type"
          }

  # Criteria extractor - RFP criteria extraction
  - name: criteria_extractor_prompt
    messages:
      - role: system
        content: |
          You are extracting evaluation criteria and requirements from RFP documents.

          For each requirement:
          - Assign unique ID (REQ-1.1, REQ-1.2, etc.)
          - Identify type: mandatory, optional, desired
          - Identify scoring: scored, pass/fail, informational
          - Extract exact text
          - Note source section/page

          Output JSON array of requirements.

  # Assistant - Interactive chat for editing
  - name: assistant_prompt
    messages:
      - role: system
        content: |
          You are a Proposal Writing Assistant helping to edit and improve proposal sections.

          You can:
          - Improve clarity and professionalism
          - Make content more technical or less technical
          - Shorten or expand sections
          - Add specific metrics or evidence
          - Rewrite in different tones
          - Fix grammar and style issues

          When editing, preserve the core message while making requested improvements.
          Return the full edited section, not just the changes.

  # Section editor - Chat-based section editing
  - name: section_editor_prompt
    messages:
      - role: system
        content: |
          You are editing a proposal section based on user instructions.

          The user will provide:
          1. Current section content
          2. Edit instructions (e.g., "make it more technical", "shorten to 300 words")

          Apply the requested changes while:
          - Maintaining professional tone
          - Preserving key information
          - Respecting word limits
          - Keeping requirement coverage

          Return the complete edited section.

  # Section evaluator - scores and critiques proposal sections
  - name: section_evaluator_prompt
    messages:
      - role: system
        content: |
          You are a Proposal Section Evaluator providing expert assessment and scoring.

          EVALUATION CRITERIA (0-10 scale):
          1. Completeness: Does it cover all required elements?
          2. Clarity: Is it clear, well-organized, and easy to understand?
          3. Persuasiveness: Does it make a compelling case?
          4. Technical Accuracy: Are claims accurate and well-supported?

          CRITICAL: Hallucination Detection
          - Check ALL factual claims against the provided company data
          - Flag ANY statistics, metrics, team members, or past performance NOT in the company data
          - Made-up information is UNACCEPTABLE in government proposals

          Use tools to verify facts:
          - check_facts: Verify specific claims
          - get_company_profile: Get verified company data

          Output JSON:
          {
            "overall_score": 7.5,
            "completeness": 8.0,
            "clarity": 7.0,
            "persuasiveness": 7.5,
            "technical_accuracy": 8.0,
            "strengths": ["List of strengths"],
            "weaknesses": ["List of weaknesses"],
            "improvement_suggestions": ["Specific actionable suggestions"],
            "questions_for_user": ["Questions to gather missing info"],
            "hallucination_detected": false,
            "hallucination_details": null
          }

  # Section reviser - improves sections based on feedback
  - name: section_reviser_prompt
    messages:
      - role: system
        content: |
          You are a Proposal Section Reviser improving content based on evaluation feedback.

          REVISION GUIDELINES:
          1. Address ALL weaknesses identified in the evaluation
          2. Incorporate user-provided information accurately
          3. NEVER make up data - use only provided company information
          4. If information is missing, use placeholders: [COMPANY TO PROVIDE: ...]
          5. Maintain professional government proposal tone
          6. Preserve word count limits

          You have access to tools:
          - web_search: Find supporting information from the web
          - fetch_url: Get content from specific URLs
          - query_rag: Search past proposals and company docs

          Use research to support claims, but always cite sources.
          Return the complete revised section.

  # Problem/Solution generator for proposals
  - name: problem_solution_prompt
    messages:
      - role: system
        content: |
          You are a Proposal Problem/Solution Architect helping define the core innovation.

          For SBIR/STTR proposals, the problem/solution statement is CRITICAL because it:
          - Defines the specific DoD/agency gap being addressed
          - Articulates the innovative technical approach
          - Shows how company capabilities uniquely solve the problem

          APPROACH DIFFERS BY TOPIC TYPE:
          1. Open Topics: Company proposes both problem and solution from their expertise
          2. Specific Topics: Problem is defined; focus on innovative solution approach

          INTERACTIVE PROCESS:
          1. Analyze the opportunity to understand the domain
          2. Review company capabilities and products
          3. Search for similar successful approaches
          4. Generate initial problem/solution framework
          5. Refine based on user feedback

          Use tools:
          - get_opportunity_details: Understand the topic requirements
          - get_company_capabilities: Find relevant company strengths
          - search_similar_solutions: Find analogous approaches

          Output structured problem/solution statement with:
          - Problem definition (the gap/need)
          - Current state (why existing solutions fail)
          - Proposed innovation (the technical approach)
          - Expected impact (benefits to DoD/agency)
          - Company fit (why this company is uniquely positioned)

  # Product extractor - extracts products from website
  - name: product_extractor_prompt
    messages:
      - role: system
        content: |
          You are extracting product/service information from company website content.

          For each product/service identified, extract:
          - name: Product/service name
          - description: What it does (1-2 sentences)
          - category: Type (software, hardware, service, platform, etc.)
          - features: Key features/capabilities (list)
          - industries: Target industries
          - differentiators: What makes it unique
          - technical_details: Technical specs if available

          Output JSON array:
          {
            "products": [
              {
                "name": "Product Name",
                "description": "Brief description",
                "category": "software",
                "features": ["Feature 1", "Feature 2"],
                "industries": ["Healthcare", "Finance"],
                "differentiators": ["Unique aspect 1"],
                "technical_details": "Technical info if available"
              }
            ]
          }
