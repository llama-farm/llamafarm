# FDA Letters Processing Strategy - Using New Schema Format
# Based on the new rag/schema.yaml structure with two-tier MIME filtering
# This configuration uses the powerful LlamaIndex PDF parser with metadata extraction

rag:
  # Database configuration with embedding and retrieval strategies
  databases:
    - name: "fda_letters_db"
      type: "ChromaStore"
      config:
        collection_name: "fda_regulatory_letters"
        persist_directory: "./data/fda_letters_vectordb"
        distance_function: "cosine"
      
      # Default strategies for this database
      default_embedding_strategy: "regulatory_embeddings"
      default_retrieval_strategy: "basic_search"
      
      # Embedding strategies for regulatory documents
      embedding_strategies:
        - name: "regulatory_embeddings"
          type: "OllamaEmbedder"
          config:
            model: "nomic-embed-text"  # Good general purpose embedder
            base_url: "http://localhost:11434"
            batch_size: 5  # Smaller batch for stability
            timeout: 60
            auto_pull: true
          default: true
          
        - name: "fast_embeddings"
          type: "OllamaEmbedder"
          config:
            model: "nomic-embed-text"  # Same model, different batch size
            base_url: "http://localhost:11434"
            batch_size: 10  # Larger batch for speed
            timeout: 30
            auto_pull: true
            
      # Retrieval strategies for regulatory queries
      retrieval_strategies:
        - name: "basic_search"
          type: "BasicSimilarityStrategy"
          config:
            top_k: 10
            distance_metric: "cosine"
            score_threshold: 0.7
            
        - name: "metadata_filtered_search"
          type: "MetadataFilteredStrategy"
          config:
            top_k: 10
            filters: {}  # Can be overridden at query time
            filter_mode: "pre"
            fallback_multiplier: 3
            
        - name: "reranked_search"
          type: "RerankedStrategy"
          config:
            initial_k: 30
            final_k: 5
            rerank_factors:
              similarity_weight: 0.7
              recency_weight: 0.1
              length_weight: 0.1
              metadata_weight: 0.1
            normalize_scores: true
            
        - name: "hybrid_regulatory_search"
          type: "HybridUniversalStrategy"
          config:
            strategies:
              - type: "BasicSimilarityStrategy"
                weight: 0.6
                config:
                  top_k: 20
              - type: "MetadataFilteredStrategy"
                weight: 0.4
                config:
                  top_k: 20
            combination_method: "weighted_average"
            final_k: 10
          default: true

  # Data processing strategy for FDA letters
  data_processing_strategies:
    - name: "fda_letters_processing"
      description: "Advanced processing pipeline for FDA regulatory action letters with comprehensive metadata extraction"
      
      # MIME type filtering - only accept PDFs
      allowed_mime_types: ["application/pdf"]
      allowed_extensions: [".pdf", ".PDF"]
      
      # Parser configuration using LlamaIndex for advanced PDF processing
      parsers:
        - type: "PDFParser_LlamaIndex"
          mime_types: ["application/pdf"]
          file_extensions: [".pdf", ".PDF"]
          priority: 10  # Highest priority
          config:
            # Chunking configuration optimized for regulatory documents
            chunk_size: 1500  # Larger chunks for regulatory context
            chunk_overlap: 300  # More overlap to preserve context
            chunk_strategy: "semantic"  # Use semantic chunking for better topic coherence
            
            # Metadata extraction
            extract_metadata: true
            extract_images: false  # FDA letters typically don't need images
            extract_tables: true  # Important for structured data
            
            # Fallback strategies for robust parsing
            fallback_strategies:
              - "llama_pdf_reader"
              - "llama_pymupdf_reader"
              - "direct_pymupdf"
              - "pypdf2_fallback"
              
        - type: "PDFParser_PyPDF2"
          mime_types: ["application/pdf"]
          file_extensions: [".pdf", ".PDF"]
          priority: 5  # Lower priority fallback
          config:
            chunk_size: 1500
            chunk_overlap: 300
            chunk_strategy: "paragraphs"
            extract_metadata: true
            preserve_layout: true
            extract_page_info: true
            clean_text: true
            
      # Metadata extractors for regulatory document analysis
      extractors:
        - type: "PatternExtractor"
          priority: 100
          config:
            predefined_patterns: ["date", "email", "phone"]
            custom_patterns:
              - name: "application_number"
                pattern: "(?:NDA|ANDA|BLA|IND)\\s*(?:\\d{6}|\\d{5})"
                description: "FDA application numbers"
              - name: "reference_number"
                pattern: "(?:Reference|Ref\\.?)\\s*(?:ID|No\\.?)?\\s*[:.]?\\s*([A-Z0-9-]+)"
                description: "Reference identifiers"
              - name: "drug_name"
                pattern: "(?:PROPRIETARY NAME|TRADE NAME|ESTABLISHED NAME)\\s*[:.]?\\s*([A-Za-z][A-Za-z\\s\\-]+)"
                description: "Drug names"
            case_sensitive: false
            return_positions: true
            
        - type: "EntityExtractor"
          priority: 90
          config:
            model: "en_core_web_sm"
            entity_types:
              - "PERSON"  # FDA officials, applicants
              - "ORG"     # Companies, FDA divisions
              - "DATE"    # Important dates
              - "GPE"     # Locations
              - "PRODUCT" # Drug/device names
            use_fallback: true
            merge_entities: true
            confidence_threshold: 0.7
            
        - type: "DateTimeExtractor"
          priority: 85
          config:
            fuzzy_parsing: true
            extract_relative: true
            extract_times: false
            extract_durations: true
            default_timezone: "US/Eastern"  # FDA headquarters timezone
            date_format: "ISO"
            prefer_dates_from: "past"
            
        - type: "KeywordExtractor"
          priority: 80
          config:
            algorithm: "yake"
            max_keywords: 20
            min_length: 2
            max_length: 4
            language: "en"
            max_ngram_size: 3
            deduplication_threshold: 0.9
            
        - type: "SummaryExtractor"
          priority: 70
          config:
            summary_sentences: 3
            algorithm: "textrank"
            include_key_phrases: true
            include_statistics: true
            min_sentence_length: 10
            max_sentence_length: 500
            
        - type: "ContentStatisticsExtractor"
          priority: 60
          config:
            include_readability: true
            include_vocabulary: true
            include_structure: true
            include_sentiment_indicators: false
            
        - type: "HeadingExtractor"
          priority: 50
          config:
            max_level: 6
            include_hierarchy: true
            extract_outline: true
            min_heading_length: 3
            enabled: true
