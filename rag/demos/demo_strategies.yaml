# Demo Strategies Configuration - NEW RAG SCHEMA FORMAT
# This demonstrates the new separated architecture with databases and data processing strategies

rag:
  # =============================================================================
  # DATABASE CONFIGURATIONS
  # =============================================================================
  databases:
    - name: "main_chroma_db"
      type: "ChromaStore"
      config:
        persist_directory: "./demos/vectordb"
        distance_function: "cosine"
      default_embedding_strategy: "nomic_embeddings"
      default_retrieval_strategy: "basic_similarity"
      embedding_strategies:
        - name: "nomic_embeddings"
          type: "OllamaEmbedder"
          config:
            model: "nomic-embed-text"
            batch_size: 5
            timeout: 60
          default: true
      retrieval_strategies:
        - name: "basic_similarity"
          type: "BasicSimilarityStrategy"
          config:
            distance_metric: "cosine"
            top_k: 5
          default: true
        - name: "metadata_filtered"
          type: "MetadataFilteredStrategy"
          config:
            top_k: 5
            filters:
              priority: ["Critical", "High"]
            filter_mode: "post"
            fallback_multiplier: 2
    
    - name: "research_papers_db"
      type: "ChromaStore"
      config:
        persist_directory: "./demos/vectordb/research_papers"
        distance_function: "cosine"
        collection_name: "research_papers"
      default_embedding_strategy: "research_embeddings"
      default_retrieval_strategy: "research_similarity"
      embedding_strategies:
        - name: "research_embeddings"
          type: "OllamaEmbedder"
          config:
            model: "nomic-embed-text"
            batch_size: 3
            timeout: 60
          default: true
      retrieval_strategies:
        - name: "research_similarity"
          type: "BasicSimilarityStrategy"
          config:
            distance_metric: "cosine"
            top_k: 3
          default: true

    - name: "customer_support_db"
      type: "ChromaStore"
      config:
        persist_directory: "./demos/vectordb/customer_support"
        distance_function: "cosine"
        collection_name: "customer_support"
      default_embedding_strategy: "support_embeddings"
      default_retrieval_strategy: "support_filtered"
      embedding_strategies:
        - name: "support_embeddings"
          type: "OllamaEmbedder"
          config:
            model: "nomic-embed-text"
            batch_size: 5
            timeout: 60
          default: true
      retrieval_strategies:
        - name: "support_filtered"
          type: "MetadataFilteredStrategy"
          config:
            top_k: 5
            filters:
              priority: ["Critical", "High"]
            filter_mode: "post"
            fallback_multiplier: 2
          default: true

  # =============================================================================
  # DATA PROCESSING STRATEGIES
  # =============================================================================
  data_processing_strategies:
    - name: "text_processing"
      description: "Standard text processing for research papers and documents"
      # Directory processing configuration (always-on)
      directory_config:
        recursive: true
        supported_files: ["*.txt", "*.pdf", "*.md", "*.doc", "*.docx"]  # Glob patterns for accepted files
        exclude_patterns: ["*.tmp", ".*", "__pycache__/*"]
        max_files: 1000
        follow_symlinks: false
      parsers:
        - type: "TextParser_Python"
          config:
            chunk_size: 1500
            chunk_overlap: 200
            chunk_strategy: "sentences"
            clean_text: true
            extract_metadata: true
      extractors:
        - type: "ContentStatisticsExtractor"
          config:
            include_readability: true
            include_vocabulary: true
            include_structure: true
            include_sentiment_indicators: true
        - type: "EntityExtractor"
          config:
            entity_types: ["PERSON", "ORG", "GPE", "DATE", "PERCENT", "PRODUCT"]
            use_fallback: true
            min_entity_length: 2
        - type: "SummaryExtractor"
          config:
            summary_sentences: 3
            min_sentence_length: 10
            max_sentence_length: 500
            include_key_phrases: true
            include_statistics: true

    - name: "csv_processing"
      description: "CSV data processing for customer support and structured data"
      # Directory processing configuration
      directory_config:
        recursive: true
        supported_files: ["*.csv", "*.tsv"]  # Glob patterns for CSV files
        exclude_patterns: ["*.tmp", ".*"]
        max_files: 500
      parsers:
        - type: "CSVParser_Pandas"
          config:
            chunk_size: 800
            chunk_overlap: 100
            chunk_strategy: "rows"
            extract_metadata: true
      extractors:
        - type: "EntityExtractor"
          config:
            entity_types: ["PERSON", "ORG", "GPE", "DATE", "PERCENT", "PRODUCT"]
            use_fallback: true
            min_entity_length: 2
        - type: "PatternExtractor"
          config:
            predefined_patterns: ["email", "phone", "url", "ip_address"]
            include_context: true
        - type: "SummaryExtractor"
          config:
            summary_sentences: 2
            min_sentence_length: 10
            max_sentence_length: 300
            include_key_phrases: true
            include_statistics: false

    - name: "markdown_processing"
      description: "Markdown processing for code documentation and technical docs"
      # Directory processing configuration
      directory_config:
        recursive: true
        include_patterns: ["*.md", "*.markdown", "*.txt"]
        exclude_patterns: ["*.tmp", ".*", "node_modules/*"]
        allowed_extensions: [".md", ".markdown", ".mdown", ".mkd", ".txt"]
        max_files: 1000
      parsers:
        - type: "MarkdownParser_Python"
          # Parser specifically handles markdown files
          mime_types: ["text/markdown", "text/x-markdown"]
          file_extensions: [".md", ".markdown", ".mdown", ".mkd"]
          config:
            chunk_size: 1200
            chunk_overlap: 150
            chunk_strategy: "sentences"
            extract_metadata: true
            extract_code_blocks: true
            extract_tables: true
            extract_links: true
            preserve_structure: true
      extractors:
        - type: "ContentStatisticsExtractor"
          config:
            include_readability: true
            include_vocabulary: true
            include_structure: true
        - type: "EntityExtractor"
          config:
            entity_types: ["PERSON", "ORG", "PRODUCT", "CARDINAL", "GPE"]
            use_fallback: true
            min_entity_length: 2

    - name: "news_processing"
      description: "HTML/web content processing for news articles"
      # Directory processing configuration
      directory_config:
        recursive: false
        include_patterns: ["*.html", "*.htm", "*.txt"]
        max_files: 100
      parsers:
        - type: "TextParser_Python"  # Generic text parser
          config:
            chunk_size: 1000
            chunk_overlap: 120
            clean_text: true
            extract_metadata: true
      extractors:
        - type: "ContentStatisticsExtractor"
          config:
            include_readability: true
            include_vocabulary: true
            include_structure: true
            include_sentiment_indicators: true
        - type: "EntityExtractor"
          config:
            entity_types: ["PERSON", "ORG", "GPE", "DATE", "EVENT", "MONEY"]
            use_fallback: true
            min_entity_length: 2
        - type: "SummaryExtractor"
          config:
            summary_sentences: 4
            min_sentence_length: 15
            max_sentence_length: 400
            include_key_phrases: true

    - name: "business_processing"
      description: "Business document processing for reports and analysis"
      # Directory processing configuration
      directory_config:
        recursive: true
        supported_files: ["*.pdf", "*.docx", "*.xlsx", "*.csv"]  # Glob patterns for business documents
        exclude_patterns: ["~$*", "*.tmp"]
        max_files: 500
      parsers:
        # PDF parser for reports
        - type: "PDFParser_LlamaIndex"
          mime_types: ["application/pdf"]
          file_extensions: [".pdf", ".PDF"]
          priority: 10
          config:
            chunk_strategy: "semantic"
            chunk_size: 1200
            chunk_overlap: 150
            preserve_equations: true
            extract_metadata: true
        # Word document parser for business docs
        - type: "DocxParser_LlamaIndex"
          mime_types: ["application/vnd.openxmlformats-officedocument.wordprocessingml.document"]
          file_extensions: [".docx", ".DOCX"]
          priority: 10
          config:
            chunk_size: 1200
            chunk_overlap: 150
            extract_metadata: true
        # Excel parser for financial data
        - type: "ExcelParser_LlamaIndex"
          mime_types: ["application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"]
          file_extensions: [".xlsx", ".XLSX"]
          priority: 10
          config:
            chunk_size: 500
            extract_metadata: true
        # CSV parser as fallback for structured data
        - type: "CSVParser_Pandas"
          mime_types: ["text/csv"]
          file_extensions: [".csv", ".CSV"]
          config:
            chunk_size: 1200
            chunk_overlap: 150
            extract_metadata: true
      extractors:
        - type: "ContentStatisticsExtractor"
          config:
            include_readability: true
            include_vocabulary: true
            include_structure: true
        - type: "EntityExtractor"
          config:
            entity_types: ["ORG", "MONEY", "PERCENT", "DATE", "CARDINAL", "PRODUCT"]
            use_fallback: true
            min_entity_length: 2
        - type: "PatternExtractor"
          config:
            predefined_patterns: ["email", "phone", "url"]
            include_context: true
        - type: "SummaryExtractor"
          config:
            summary_sentences: 3
            min_sentence_length: 15
            max_sentence_length: 350
            include_key_phrases: true

    - name: "llamaindex_pdf_processing"
      description: "Advanced PDF processing using LlamaIndex parsers"
      # Directory processing configuration
      directory_config:
        recursive: true
        include_patterns: ["*.pdf", "*.PDF"]
        max_files: 100
      parsers:
        - type: "PDFParser_LlamaIndex"
          config:
            chunk_strategy: "semantic"
            chunk_size: 1000
            chunk_overlap: 200
            preserve_equations: true
            extract_images: true
            extract_metadata: true
            fallback_strategies: ["pypdf2_fallback"]
      extractors:
        - type: "ContentStatisticsExtractor"
          config:
            include_readability: true
            include_vocabulary: true
            include_structure: true
        - type: "EntityExtractor"
          config:
            entity_types: ["PERSON", "ORG", "GPE", "DATE", "PRODUCT"]
            use_fallback: true

    - name: "llamaindex_multiformat_processing"
      description: "Multi-format processing using LlamaIndex parsers"
      # Directory processing configuration
      directory_config:
        recursive: true
        include_patterns: ["*"]
        exclude_patterns: ["*.tmp", ".*", "__pycache__/*"]
        max_files: 1000
      parsers:
        - type: "TextParser_LlamaIndex"  # LlamaIndex text parser
          config:
            chunk_strategy: "sentences"
            chunk_size: 1000
            chunk_overlap: 200
            extract_metadata: true
      extractors:
        - type: "ContentStatisticsExtractor"
          config:
            include_readability: true
            include_vocabulary: true
            include_structure: true
        - type: "EntityExtractor"
          config:
            entity_types: ["PERSON", "ORG", "GPE", "DATE", "PRODUCT", "CARDINAL"]
            use_fallback: true

# =============================================================================
# END OF CONFIGURATION
# =============================================================================