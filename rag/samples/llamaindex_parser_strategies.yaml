# LlamaIndex Parser Strategies - NEW RAG SCHEMA FORMAT
# This file demonstrates the advanced capabilities of LlamaIndex parsers with MIME type filtering
# These parsers provide sophisticated chunking strategies and enhanced metadata extraction

rag:
  # =============================================================================
  # DATABASE CONFIGURATIONS
  # =============================================================================
  databases:
    - name: "llamaindex_documents_db"
      type: "ChromaStore"
      config:
        persist_directory: "./vectordb/llamaindex"
        distance_function: "cosine"
        collection_name: "documents"
      default_embedding_strategy: "llamaindex_embeddings"
      default_retrieval_strategy: "semantic_search"
      embedding_strategies:
        - name: "llamaindex_embeddings"
          type: "OllamaEmbedder"
          config:
            model: "nomic-embed-text"
            batch_size: 8
            timeout: 60
          default: true
      retrieval_strategies:
        - name: "semantic_search"
          type: "BasicSimilarityStrategy"
          config:
            distance_metric: "cosine"
            top_k: 10
          default: true

  # =============================================================================
  # DATA PROCESSING STRATEGIES WITH MIME TYPE FILTERING
  # =============================================================================
  data_processing_strategies:
    # Advanced PDF Processing with LlamaIndex
    - name: "advanced_pdf_processing"
      description: "Sophisticated PDF processing with LlamaIndex's multiple fallback strategies"
      # This strategy ONLY accepts PDF files
      allowed_mime_types: ["application/pdf"]
      allowed_extensions: [".pdf", ".PDF"]
      parsers:
        - type: "PDFParser_LlamaIndex"
          # Parser explicitly handles PDF files
          mime_types: ["application/pdf"]
          file_extensions: [".pdf", ".PDF"]
          priority: 10
          config:
            chunk_size: 2000
            chunk_overlap: 300
            chunk_strategy: "semantic"  # Options: sentences, paragraphs, pages, semantic
            extract_metadata: true
            extract_images: true
            extract_tables: true
            # Multiple fallback strategies ensure robust parsing
            fallback_strategies:
              - "llama_pdf_reader"      # Primary LlamaIndex PDF reader
              - "llama_pymupdf_reader"  # PyMuPDF-based fallback
              - "direct_pymupdf"        # Direct PyMuPDF extraction
              - "pypdf2_fallback"       # Final fallback to PyPDF2
      extractors:
        - type: "ContentStatisticsExtractor"  # Changed from TableExtractor
          config:
            output_format: "markdown"
            extract_headers: true
        - type: "EntityExtractor"  # Changed from CitationExtractor
          config:
            formats: ["APA", "MLA", "Chicago"]
        - type: "KeywordExtractor"  # Changed from FigureExtractor
          config:
            extract_captions: true
            save_images: true

    # Multi-Format Document Processing
    - name: "multi_format_documents"
      description: "Handles multiple document formats with appropriate LlamaIndex parsers"
      # Strategy accepts common document formats
      allowed_mime_types: [
        "application/pdf",
        "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        "text/markdown",
        "text/plain",
        "text/csv"
      ]
      allowed_extensions: [".pdf", ".docx", ".md", ".txt", ".csv"]
      parsers:
        # PDF Parser with high priority
        - type: "PDFParser_LlamaIndex"
          mime_types: ["application/pdf"]
          file_extensions: [".pdf", ".PDF"]
          priority: 10
          config:
            chunk_strategy: "semantic"
            chunk_size: 1500
            chunk_overlap: 200
            extract_metadata: true
        
        # Word Document Parser
        - type: "DocxParser_LlamaIndex"
          mime_types: ["application/vnd.openxmlformats-officedocument.wordprocessingml.document"]
          file_extensions: [".docx", ".DOCX"]
          priority: 10
          config:
            chunk_size: 1500
            chunk_overlap: 200
            extract_metadata: true
            preserve_formatting: true
        
        # Markdown Parser
        - type: "MarkdownParser_LlamaIndex"
          mime_types: ["text/markdown", "text/x-markdown"]
          file_extensions: [".md", ".markdown", ".mdown"]
          priority: 10
          config:
            chunk_strategy: "sections"
            preserve_code_blocks: true
            extract_links: true
            extract_metadata: true
        
        # CSV Parser for structured data
        - type: "CSVParser_LlamaIndex"
          mime_types: ["text/csv"]
          file_extensions: [".csv", ".CSV"]
          priority: 10
          config:
            chunk_strategy: "rows"
            chunk_size: 100
            infer_schema: true
            extract_metadata: true
        
        # Plain Text Parser as fallback
        - type: "TextParser_LlamaIndex"
          mime_types: ["text/plain"]
          file_extensions: [".txt", ".log", ".text"]
          priority: 5  # Lower priority - used as fallback
          config:
            chunk_strategy: "sentences"
            chunk_size: 1500
            chunk_overlap: 200
      
      extractors:
        - type: "ContentStatisticsExtractor"
          config:
            include_readability: true
            include_vocabulary: true
        - type: "EntityExtractor"
          config:
            entity_types: ["PERSON", "ORG", "GPE", "DATE", "PRODUCT"]

    # Spreadsheet-Only Processing
    - name: "spreadsheet_analysis"
      description: "Specialized processing for Excel and CSV files"
      # Strategy ONLY accepts spreadsheet formats
      allowed_mime_types: [
        "text/csv",
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        "application/vnd.ms-excel"
      ]
      allowed_extensions: [".csv", ".xlsx", ".xls", ".tsv"]
      parsers:
        # Excel Parser for modern formats
        - type: "ExcelParser_LlamaIndex"
          mime_types: [
            "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
            "application/vnd.ms-excel"
          ]
          file_extensions: [".xlsx", ".xls", ".XLSX", ".XLS"]
          priority: 10
          config:
            chunk_strategy: "sheets"
            chunk_size: 500
            extract_formulas: true
            extract_metadata: true
            handle_merged_cells: true
        
        # CSV Parser for delimited files
        - type: "CSVParser_LlamaIndex"
          mime_types: ["text/csv", "text/tab-separated-values"]
          file_extensions: [".csv", ".tsv", ".CSV", ".TSV"]
          priority: 10
          config:
            chunk_strategy: "rows"
            chunk_size: 100
            infer_delimiter: true
            infer_schema: true
            handle_missing_values: true
      
      extractors:
        - type: "ContentStatisticsExtractor"  # Changed from TableStructureExtractor
          config:
            detect_headers: true
            detect_data_types: true
        - type: "EntityExtractor"  # Changed from DataQualityExtractor
          config:
            check_completeness: true
            check_consistency: true

    # Web Content Processing
    - name: "web_content_processing"
      description: "Process HTML and web-scraped content"
      # Strategy accepts web formats
      allowed_mime_types: ["text/html", "application/xhtml+xml"]
      allowed_extensions: [".html", ".htm", ".xhtml"]
      parsers:
        - type: "TextParser_LlamaIndex"  # Changed from WebParser_LlamaIndex
          mime_types: ["text/html", "application/xhtml+xml"]
          file_extensions: [".html", ".htm", ".xhtml"]
          config:
            chunk_strategy: "semantic"
            chunk_size: 1500
            chunk_overlap: 200
            extract_links: true
            extract_metadata: true
            clean_scripts: true
            clean_styles: true
      extractors:
        - type: "KeywordExtractor"  # Changed from LinkExtractor
          config:
            extract_internal: true
            extract_external: true
        - type: "ContentStatisticsExtractor"  # Changed from MetaTagExtractor
          config:
            extract_og_tags: true
            extract_twitter_cards: true

    # Code Documentation Processing
    - name: "code_documentation"
      description: "Process code files and documentation"
      # Strategy accepts code and documentation formats
      allowed_mime_types: [
        "text/x-python",
        "text/x-java",
        "application/javascript",
        "text/markdown"
      ]
      allowed_extensions: [".py", ".java", ".js", ".ts", ".md", ".rst"]
      parsers:
        # Python Code Parser
        - type: "TextParser_LlamaIndex"
          mime_types: ["text/x-python"]
          file_extensions: [".py"]
          priority: 10
          config:
            language: "python"
            chunk_strategy: "functions"
            extract_docstrings: true
            extract_imports: true
            extract_classes: true
        
        # Java Code Parser
        - type: "TextParser_LlamaIndex"
          mime_types: ["text/x-java"]
          file_extensions: [".java"]
          priority: 10
          config:
            language: "java"
            chunk_strategy: "classes"
            extract_javadoc: true
            extract_imports: true
        
        # JavaScript/TypeScript Parser
        - type: "TextParser_LlamaIndex"
          mime_types: ["application/javascript", "text/typescript"]
          file_extensions: [".js", ".ts", ".jsx", ".tsx"]
          priority: 10
          config:
            language: "javascript"
            chunk_strategy: "functions"
            extract_jsdoc: true
            extract_imports: true
        
        # Documentation Parser
        - type: "MarkdownParser_LlamaIndex"
          mime_types: ["text/markdown", "text/x-rst"]
          file_extensions: [".md", ".rst", ".markdown"]
          priority: 10
          config:
            chunk_strategy: "sections"
            preserve_code_blocks: true
            extract_links: true
      
      extractors:
        - type: "KeywordExtractor"  # Changed from CodeAnalysisExtractor
          config:
            analyze_complexity: true
            extract_dependencies: true
        - type: "EntityExtractor"  # Changed from DocumentationExtractor
          config:
            extract_api_docs: true
            extract_examples: true

# =============================================================================
# USAGE EXAMPLES
# =============================================================================
# 
# 1. Process only PDF files:
#    python cli.py ingest /path/to/pdfs --strategy advanced_pdf_processing
#
# 2. Process mixed document types:
#    python cli.py ingest /path/to/docs --strategy multi_format_documents
#
# 3. Process spreadsheets only:
#    python cli.py ingest /path/to/data --strategy spreadsheet_analysis
#
# 4. The system will automatically:
#    - Filter files based on strategy's allowed_mime_types and allowed_extensions
#    - Route each file to the appropriate parser based on MIME type and extension
#    - Use parser priority to select the best parser when multiple match
#    - Fall back to generic parsers when specific ones aren't available
#

