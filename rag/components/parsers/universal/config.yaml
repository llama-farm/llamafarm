parsers:
  - name: UniversalParser
    display_name: "Universal Parser (MarkItDown + SemChunk)"
    version: "1.0.0"
    tool: "MarkItDown-Universal"
    parser_type: "universal"
    supported_extensions:
      - .pdf
      - .docx
      - .xlsx
      - .pptx
      - .csv
      - .json
      - .xml
      - .html
      - .htm
      - .png
      - .jpg
      - .jpeg
      - .txt
      - .md
    mime_types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - text/csv
      - application/json
      - application/xml
      - text/xml
      - text/html
      - image/png
      - image/jpeg
      - text/plain
      - text/markdown
    capabilities:
      - text_extraction
      - markdown_conversion
      - semantic_chunking
      - page_chunking
      - ocr_fallback
    dependencies:
      required:
        - markitdown>=0.1.4
        - semchunk>=2.0.0
        - tiktoken>=0.5.0
      optional:
        - surya-ocr>=0.4.0
        - llamafarm-common
    default_config:
      chunk_size: 1024
      chunk_strategy: semantic
      use_ocr: true
      ocr_min_text_threshold: 50
      model_for_tokens: gpt-4
