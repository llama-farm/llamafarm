# Fat wheel definition for PyApp packaging of the LlamaFarm Universal Runtime.
#
# This pyproject.toml is used in a temporary build directory that contains
# symlinks/copies of all required packages. It bundles runtime + common +
# llamafarm-llama into a single wheel so PyApp can embed it via PYAPP_PROJECT_PATH.
#
# Not used for normal development — only for PyApp binary builds.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llamafarm-runtime"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # --- Runtime dependencies ---
    "transformers>=4.35.0",
    "diffusers>=0.25.0",
    "accelerate>=0.25.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "python-multipart",
    "einops>=0.8.1",
    "openai>=1.0.0",
    "structlog>=24.0.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "gguf>=0.17.1",
    "pymupdf>=1.26.6",
    "protobuf>=5.29.3",
    "sentencepiece>=0.2.1",
    "cachetools>=6.0.0",
    "jinja2>=3.0.0",
    # Anomaly detection
    "scikit-learn>=1.3.0",
    # Text classification (few-shot learning with SetFit)
    "setfit>=1.1.0",
    "sentence-transformers>=3.0.0",
    # OCR backends
    "surya-ocr>=0.6.0",
    "easyocr>=1.7.0",
    "opencv-python-headless>=4.8.0",
    "pytesseract>=0.3.10",
    # --- Common dependencies (bundled, not from PyPI) ---
    "huggingface_hub>=0.24.0",
    "hf-transfer>=0.1.9",
    "filelock>=3.16.1",
    # --- llamafarm-llama dependencies (bundled, not from PyPI) ---
    "cffi>=1.15.0",
    "numpy>=1.20.0",
    # --- ML / Hardware-specific ---
    # torch is NOT listed here — it is installed separately by the CLI after
    # initial bootstrap, using the appropriate index for the user's hardware
    # (CPU, CUDA, ROCm). See: cli/internal/deploy/
    # --- Platform-specific ---
    "pywin32>=306; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
# Top-level packages in the fat wheel.
# Runtime subpackages (models, utils, core, routers, etc.) are nested inside
# runtime/ so both bare imports (from models.xxx) and prefixed imports
# (from runtime.models.xxx) work via the __main__.py sys.path shim.
packages = [
    "runtime",
    "llamafarm_common",
    "llamafarm_llama",
]

# Include non-Python data files that aren't auto-discovered.
# Paths are relative to the temp build directory root.
[tool.hatch.build.targets.wheel.force-include]
"runtime/config" = "runtime/config"
