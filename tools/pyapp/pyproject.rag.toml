# Fat wheel definition for PyApp packaging of the LlamaFarm RAG worker.
#
# This pyproject.toml is used in a temporary build directory that contains
# symlinks/copies of all required packages. It bundles rag + config + common +
# observability into a single wheel so PyApp can embed it via PYAPP_PROJECT_PATH.
#
# Not used for normal development — only for PyApp binary builds.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llamafarm-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # --- RAG dependencies ---
    "chromadb>=1.0.0",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "colorama>=0.4.6",
    "pypdf2>=3.0.0",
    "reportlab>=4.4.3",
    "pyyaml>=6.0.2",
    "rich>=14.1.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "python-docx>=1.0.0",
    "chardet>=5.0.0",
    "python-magic>=0.4.27",
    "llama-index>=0.13.6",
    "celery>=5.5.3",
    "structlog>=25.4.0",
    "psutil>=7.0.0",
    "pydantic-settings>=2.11.0",
    "docx2txt>=0.9",
    "spacy>=3.8.7",
    "msg-parser[rtf]>=1.2.0",
    "markitdown>=0.1.4",
    "semchunk>=2.2.0",
    "tiktoken>=0.7.0",
    "yake>=0.4.8",
    "llama-index-core>=0.9.0",
    "llama-index-readers-file>=0.1.0",
    "urllib3>=2.3.0",
    "aiohttp>=3.11.11",
    "protobuf>=5.29.3",
    "filelock>=3.16.1",
    "pypdf>=5.1.0",
    "authlib>=1.4.0",
    "orjson>=3.10.14",
    "marshmallow>=3.26.1",
    # --- Config dependencies (bundled, not from PyPI) ---
    "jsonschema>=4.23.0",
    "jsonschema-path>=0.3.4",
    "ruamel.yaml>=0.18.0",
    "tomli-w>=1.0.0",
    "jsonref>=1.1.0",
    # --- Common dependencies (bundled, not from PyPI) ---
    "huggingface_hub>=0.24.0",
    "hf-transfer>=0.1.9",
    # --- Platform-specific ---
    "pywin32>=306; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
# Top-level packages in the fat wheel.
# RAG subpackages (core, components, tasks, utils, cli) are nested inside rag/
# so both bare imports (from core.xxx) and prefixed imports (from rag.core.xxx)
# work via the __main__.py sys.path shim.
packages = [
    "rag",
    "config",
    "llamafarm_common",
    "observability",
]

# Include non-Python data files that aren't auto-discovered.
# Paths are relative to the temp build directory root.
[tool.hatch.build.targets.wheel.force-include]
"config/templates" = "config/templates"
"config/schema.yaml" = "config/schema.yaml"
"config/schema.deref.yaml" = "config/schema.deref.yaml"
