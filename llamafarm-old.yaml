version: v1
name: llamafarm-1
namespace: default

# =============================================================================
# RUNTIME CONFIGURATION
# =============================================================================
runtime:
  provider: ollama
  model: llama3.2
  base_url: http://localhost:11434
  temperature: 0.5
  api_key: null
  instructor_mode: null
  model_api_parameters: null

# =============================================================================
# PROMPTS & DATASETS
# =============================================================================
prompts: []
datasets: []

# =============================================================================
# RAG CONFIGURATION
# =============================================================================
rag:
  # =============================================================================
  # DATABASES
  # =============================================================================
  databases:
    - name: main_database
      type: ChromaStore
      config:
        collection_name: documents
        distance_function: cosine
        persist_directory: ./data/chroma_db
        port: 8000
      default_embedding_strategy: default_embeddings
      default_retrieval_strategy: basic_search
      embedding_strategies:
        - name: default_embeddings
          type: OllamaEmbedder
          priority: 0
          condition: null
          config:
            auto_pull: true
            base_url: http://localhost:11434/
            batch_size: 16
            dimension: 768
            model: nomic-embed-text
            timeout: 60
        - name: fast_embeddings
          type: OllamaEmbedder
          priority: 0
          condition: null
          config:
            auto_pull: true
            base_url: http://localhost:11434/
            batch_size: 32
            dimension: 768
            model: nomic-embed-text
            timeout: 30
      retrieval_strategies:
        - name: basic_search
          type: BasicSimilarityStrategy
          default: true
          config:
            distance_metric: cosine
            top_k: 10
        - name: filtered_search
          type: MetadataFilteredStrategy
          default: false
          config:
            fallback_multiplier: 2
            filter_mode: post
            top_k: 10

  # =============================================================================
  # SINGLE UNIFIED DATA PROCESSING STRATEGY
  # =============================================================================
  data_processing_strategies:
    - name: universal_processor
      description: "Single strategy handling all document types with pattern-based routing"
      parsers:
        # PDF Parsers (with fallback)
        - type: PDFParser_LlamaIndex
          file_include_patterns: ["*.pdf", "*.PDF"]
          file_exclude_patterns: ["*_draft.pdf", "*.tmp.pdf", "~$*.pdf"]
          priority: 100
          config:
            chunk_strategy: semantic
            chunk_size: 1000
            chunk_overlap: 200
            extract_metadata: true
            extract_images: false
            preserve_equations: true
        
        - type: PDFParser_PyPDF2
          file_include_patterns: ["*.pdf", "*.PDF"]
          file_exclude_patterns: ["*_draft.pdf", "*.tmp.pdf", "~$*.pdf"]
          priority: 50
          config:
            chunk_strategy: paragraphs
            chunk_size: 1000
            chunk_overlap: 150
            extract_metadata: true
        
        # Word Document Parser
        - type: DocxParser_LlamaIndex
          file_include_patterns: ["*.docx", "*.DOCX", "*.doc", "*.DOC"]
          file_exclude_patterns: ["~$*", "*.tmp", "*_backup.*"]
          priority: 100
          config:
            chunk_size: 1000
            chunk_overlap: 150
            extract_metadata: true
        
        # CSV/TSV Parser
        - type: CSVParser_Pandas
          file_include_patterns: ["*.csv", "*.CSV", "*.tsv", "*.TSV", "*.dat"]
          file_exclude_patterns: ["*_backup.csv", "*.tmp.csv", "~$*.csv"]
          priority: 100
          config:
            chunk_size: 500
            chunk_strategy: rows
            extract_metadata: true
        
        # Excel Parser
        - type: ExcelParser_LlamaIndex
          file_include_patterns: ["*.xlsx", "*.XLSX", "*.xls", "*.XLS"]
          file_exclude_patterns: ["~$*", "*.tmp.xlsx", "*_backup.xlsx"]
          priority: 100
          config:
            chunk_size: 500
            extract_metadata: true
        
        # Markdown Parser
        - type: MarkdownParser_Python
          file_include_patterns: ["*.md", "*.markdown", "*.mdown", "*.mkd", "README*", "CHANGELOG*"]
          file_exclude_patterns: ["*.tmp.md", "_draft*.md", ".*.md"]
          priority: 100
          config:
            chunk_size: 1000
            chunk_strategy: sections
            extract_metadata: true
            extract_code_blocks: true
            extract_links: true
        
        # Universal Text Parser (catch-all)
        - type: TextParser_Python
          file_include_patterns: [
            "*.txt", "*.text", "*.log",
            "*.json", "*.xml", "*.yaml", "*.yml", "*.toml",
            "*.cfg", "*.conf", "*.ini", "*.properties",
            "*.py", "*.js", "*.java", "*.cpp", "*.c", "*.h", "*.go", "*.rs",
            "*.sh", "*.bash", "*.zsh", "*.ps1", "*.bat",
            "LICENSE*", "AUTHORS*", "NOTICE*", "COPYRIGHT*",
            "*.sql", "*.css", "*.html", "*.htm"
          ]
          file_exclude_patterns: [
            "*.pyc", "*.pyo", "*.class", "*.o", "*.so", "*.dll", "*.exe",
            "*.jpg", "*.png", "*.gif", "*.bmp", "*.ico", "*.svg",
            "*.mp3", "*.mp4", "*.avi", "*.mov", "*.wav",
            "*.zip", "*.tar", "*.gz", "*.rar", "*.7z"
          ]
          priority: 10  # Lowest priority - catch-all
          config:
            chunk_size: 1000
            chunk_overlap: 100
            chunk_strategy: sentences
            extract_metadata: true
            encoding: utf-8
            clean_text: true
      
      # Extractors with pattern matching
      extractors:
        # Universal extractors (apply to all files)
        - type: ContentStatisticsExtractor
          file_include_patterns: ["*"]
          file_exclude_patterns: []
          priority: 100
          condition: null
          required_for: null
          config:
            include_readability: true
            include_structure: true
            include_vocabulary: true
        
        - type: EntityExtractor
          file_include_patterns: ["*"]
          file_exclude_patterns: []
          priority: 90
          condition: null
          required_for: null
          config:
            entity_types: [PERSON, ORG, GPE, DATE, PRODUCT, MONEY, PERCENT]
            min_entity_length: 2
            use_fallback: true
        
        - type: KeywordExtractor
          file_include_patterns: ["*"]
          file_exclude_patterns: []
          priority: 80
          condition: null
          required_for: null
          config:
            algorithm: yake
            max_keywords: 10
            min_keyword_length: 3
        
        # PDF-specific extractors
        - type: TableExtractor
          file_include_patterns: ["*.pdf", "*.PDF"]
          file_exclude_patterns: []
          priority: 100
          condition: null
          required_for: null
          config:
            output_format: dict
            extract_headers: true
            merge_cells: true
            min_rows: 2
        
        # Data file extractors (CSV, Excel)
        - type: DateTimeExtractor
          file_include_patterns: ["*.csv", "*.tsv", "*.xlsx", "*.xls"]
          file_exclude_patterns: []
          priority: 100
          condition: null
          required_for: null
          config:
            extract_relative: true
            formats: [ISO8601, US, EU]
            extract_times: true
            extract_durations: true
        
        # Markdown/HTML extractors
        - type: HeadingExtractor
          file_include_patterns: ["*.md", "*.markdown", "*.html", "*.htm", "README*"]
          file_exclude_patterns: []
          priority: 100
          condition: null
          required_for: null
          config:
            max_level: 6
            include_hierarchy: true
            extract_outline: true
        
        - type: LinkExtractor
          file_include_patterns: ["*.md", "*.markdown", "*.html", "*.htm", "*.rst"]
          file_exclude_patterns: []
          priority: 90
          condition: null
          required_for: null
          config:
            extract_urls: true
            extract_emails: true
            extract_domains: true
            validate_urls: false
        
        # Code file extractors
        - type: PatternExtractor
          file_include_patterns: [
            "*.py", "*.js", "*.java", "*.cpp", "*.c", "*.h",
            "*.go", "*.rs", "*.swift", "*.kt", "*.scala"
          ]
          file_exclude_patterns: []
          priority: 100
          condition: null
          required_for: null
          config:
            predefined_patterns: [email, url, ip_address, version]
            custom_patterns:
              - name: import_statement
                pattern: "^import\\s+.*$|^from\\s+.*\\s+import"
                description: "Import statements"
              - name: function_def
                pattern: "def\\s+\\w+\\s*\\(|function\\s+\\w+\\s*\\(|func\\s+\\w+"
                description: "Function definitions"
              - name: class_def
                pattern: "class\\s+\\w+[\\(\\:]|interface\\s+\\w+|struct\\s+\\w+"
                description: "Class/interface/struct definitions"