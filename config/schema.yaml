# yaml-language-server: $schema=http://json-schema.org/draft-07/schema#

$schema: http://json-schema.org/draft-07/schema#
title: LlamaFarm Config
type: object
required:
  - version
  - name
  - namespace
  - runtime
properties:
  version:
    type: string
    enum: [v1]
    default: v1
    description: Config version, must be "v1"
  name:
    type: string
    description: Project name
    example: my-project
  namespace:
    type: string
    description: Project namespace
    example: my-namespace
  prompts:
    type: array
    description: List of named prompt sets
    items:
      title: PromptSet
      type: object
      required:
        - name
        - messages
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: Unique prompt set identifier
        messages:
          type: array
          description: List of messages in this prompt set
          items:
            type: object
            title: PromptMessage
            required:
              - role
              - content
            properties:
              role:
                type: string
                description: 'Message role (e.g., "system", "user", "assistant", "tool")'
              content:
                type: string
                description: Message content
              tool_call_id:
                type: string
                description: Tool call ID
          default: []
    default: []

  rag:
    $ref: "../rag/schema.yaml"

  # Memory Store Configuration (Phase 2)
  memory:
    title: MemoryConfig
    type: object
    description: Memory store configurations for the project
    additionalProperties: false
    properties:
      stores:
        type: array
        description: List of memory store configurations
        default: []
        items:
          $ref: "#/definitions/MemoryStoreConfig"
      default_store:
        type: string
        description: Name of the default memory store

  # Dataset Configuration (Phase 3 - Unified Architecture)
  datasets:
    type: array
    description: List of dataset configurations
    default: []
    items:
      $ref: "#/definitions/Dataset"

  runtime:
    type: object
    properties:
      default_model:
        type: string
        description: Name of the default model to use (references a model name in the models list). If not specified, uses first model.

      models:
        type: array
        description: List of model configurations for multi-model support
        items:
          type: object
          required:
            - name
            - provider
            - model
          properties:
            name:
              type: string
              description: Model identifier (unique name)
            description:
              type: string
              description: Human-readable description of this model configuration
            provider:
              type: string
              enum: [openai, ollama, lemonade, universal]
              description: Runtime provider for this model
            model:
              type: string
              description: Model name or ID
            base_url:
              type: string
              description: Base URL for the provider
            api_key:
              type: string
              description: API key for the provider
            instructor_mode:
              type: string
              description: "Instructor mode to use for structured output (e.g., tools, json, md_json)"
            model_api_parameters:
              type: object
              description: |
                Additional parameters passed directly to the API provider as request parameters.
                Common examples: temperature, top_p, max_tokens, frequency_penalty, etc.
              additionalProperties: true
            extra_body:
              type: object
              description: |
                Provider-specific parameters passed in the request body's extra_body field.
                These parameters are sent directly to the underlying provider API.

                Note: For GGUF quantization, specify it in the model name using the format
                "model_id:quantization" (e.g., "unsloth/Qwen3-4B-GGUF:Q4_K_M").
              properties:
                n_ctx:
                  type: integer
                  description: |
                    Context window size for GGUF models (Universal runtime only).
                    If not specified, automatically computed based on available memory,
                    model training context, and pattern-based defaults.
                    See Universal runtime documentation for auto-detection behavior.
              additionalProperties: true
            encoder_config:
              type: object
              description: |
                Configuration for BERT-style encoder models (Universal runtime only).
                Used for embeddings, classification, reranking, and NER endpoints.
              properties:
                max_length:
                  type: integer
                  minimum: 1
                  description: |
                    Maximum sequence length for tokenization. Auto-detected if not specified.
                    ModernBERT supports up to 8,192 tokens, classic BERT supports 512.
                    Must be a positive integer if specified.
                use_flash_attention:
                  type: boolean
                  description: |
                    Enable Flash Attention 2 for faster inference on CUDA devices.
                    Requires flash_attn package and compatible GPU.
                  default: true
                task:
                  type: string
                  enum: [embedding, classification, reranking, ner]
                  description: |
                    Task type for the encoder model:
                    - embedding: Generate dense vector representations
                    - classification: Sentiment, spam detection, intent routing
                    - reranking: Cross-encoder document reranking
                    - ner: Named entity recognition
                  default: embedding
            prompts:
              type: array
              description: List of prompt set names to use for this model (merged in order)
              items:
                type: string
              default: []
            mcp_servers:
              type: array
              description: List of MCP server names to use for this model (omit to use all servers, empty list for none)
              items:
                type: string
            tool_call_strategy:
              type: string
              enum: [native_api, prompt_based]
              description: |
                Strategy to use for tool calls. `native_api` uses native tool calling through the client
                library (e.g. setting the `tools` parameter on the chat completions OpenAI request);
                `prompt_based` uses system prompting to inject tool definitions and instructions to guide
                any model to use tools. This is universal, but may not be as effective as native tool calling.
                Use `prompt_based` for models that do not support native tool calling.
              default: native_api
            tools:
              type: array
              description: List of tools to use for this model
              items:
                $ref: "#/definitions/Tool"
              default: []

  mcp:
    type: object
    description: Model Context Protocol (MCP) client configuration
    properties:
      servers:
        type: array
        description: List of MCP Servers available to the project during inference
        items:
          type: object
          required:
            - name
            - transport
          properties:
            name:
              type: string
              description: MCP server identifier
            transport:
              type: string
              enum: [stdio, http, sse]
              description: Connection transport to the MCP server
            # stdio transport
            command:
              type: string
              description: Command/binary to launch the MCP server (stdio)
            args:
              type: array
              description: Optional args for the stdio command
              items:
                type: string
            env:
              type: object
              description: Environment variables for the stdio command
              additionalProperties:
                type: string
            # http transport
            base_url:
              type: string
              description: Base URL of the MCP server (http)
            headers:
              type: object
              description: HTTP headers for the MCP server
              additionalProperties:
                type: string
              example:
                Authorization: Bearer ${env:MCP_SERVER_TOKEN}

definitions:
  Tool:
    type: object
    required:
      - type
      - name
      - description
      - parameters
    properties:
      type:
        type: string
        enum: [function]
        description: Type of tool
      name:
        type: string
        description: Name of the tool
      description:
        type: string
        description: Description of the tool
      parameters:
        type: object
        description: Parameters of the tool
        additionalProperties: true

  # ============================================
  # Memory Store Configurations (Phase 2)
  # ============================================

  WorkingMemoryConfig:
    type: object
    description: Configuration for working memory (short-term buffer with TTL)
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: true
        description: Whether working memory is enabled
      ttl_seconds:
        type: integer
        default: 3600
        description: Time-to-live for records in seconds
      max_records:
        type: integer
        default: 10000
        description: Maximum records before auto-prune

  TimeSeriesConfig:
    type: object
    description: Configuration for time-series store
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: true
        description: Whether time-series store is enabled
      retention_days:
        type: integer
        default: 30
        description: Days to retain time-series data

  SpatialConfig:
    type: object
    description: Configuration for geo-spatial store (top-level, separate from time-series)
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: true
        description: Whether spatial store is enabled
      retention_days:
        type: integer
        default: 30
        description: Days to retain spatial data
      index_type:
        type: string
        default: rtree
        description: Spatial index type (rtree, geohash)

  GraphConfig:
    type: object
    description: Configuration for graph store
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: true
        description: Whether graph store is enabled
      max_path_depth:
        type: integer
        default: 10
        description: Maximum depth for path finding
      entity_extraction:
        type: boolean
        default: true
        description: Extract entities from documents using NER
      relationship_extraction:
        type: boolean
        default: false
        description: Extract relationships via LLM

  ConsolidationConfig:
    type: object
    description: Configuration for memory consolidation
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: true
        description: Whether consolidation is enabled
      interval_seconds:
        type: integer
        default: 300
        description: Consolidation interval in seconds
      min_records:
        type: integer
        default: 10
        description: Minimum records before consolidation
      batch_size:
        type: integer
        default: 100
        description: Batch size for consolidation
      prune_after_consolidate:
        type: boolean
        default: true
        description: Prune after consolidation
      extract_summaries:
        type: boolean
        default: false
        description: Create embeddings from consolidated data

  MemoryStoreConfig:
    type: object
    description: Configuration for a named memory store
    required:
      - name
    additionalProperties: false
    properties:
      name:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
        minLength: 1
        maxLength: 50
        description: Unique memory store identifier
      working_memory:
        $ref: "#/definitions/WorkingMemoryConfig"
      timeseries:
        $ref: "#/definitions/TimeSeriesConfig"
      spatial:
        $ref: "#/definitions/SpatialConfig"
      graph:
        $ref: "#/definitions/GraphConfig"
      consolidation:
        $ref: "#/definitions/ConsolidationConfig"

  # ============================================
  # Dataset Type System (Phase 3 - Unified Architecture)
  # ============================================

  DatasetType:
    type: string
    description: Dataset types determine which storage backends are enabled
    enum:
      - knowledge    # Vector + Graph (document RAG with entity extraction)
      - realtime     # All stores (streaming telemetry, chat, live data)
      - graph        # Graph only (pure knowledge graph)
      - timeseries   # TimeSeries + WorkingMemory (IoT, metrics)
      - spatial      # Spatial + WorkingMemory (geo-tracking only)
      - hybrid       # All capabilities enabled
    default: knowledge

  VectorConfig:
    type: object
    description: Configuration for vector/semantic store in datasets
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: true
        description: Whether vector store is enabled
      store:
        type: string
        default: ChromaStore
        description: Vector store type
      collection:
        type: string
        description: Collection name (auto-generated if not specified)
      embedding_strategy:
        type: string
        description: Embedding strategy name
      retrieval_strategy:
        type: string
        description: Retrieval strategy name

  DatasetGraphConfig:
    type: object
    description: Configuration for graph store in datasets (uses RAG pipeline for entity extraction)
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: true
        description: Whether graph store is enabled
      entity_extraction:
        type: boolean
        default: true
        description: Extract entities from documents using NER
      relationship_extraction:
        type: boolean
        default: false
        description: Extract relationships via LLM
      max_path_depth:
        type: integer
        default: 10
        description: Maximum depth for path finding

  DatasetTimeSeriesConfig:
    type: object
    description: Configuration for time-series store in datasets
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: true
        description: Whether time-series store is enabled
      retention_days:
        type: integer
        default: 30
        description: Days to retain time-series data

  DatasetSpatialConfig:
    type: object
    description: Configuration for geo-spatial store in datasets (top-level, separate from time-series)
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: true
        description: Whether spatial store is enabled
      retention_days:
        type: integer
        default: 30
        description: Days to retain spatial data
      index_type:
        type: string
        default: rtree
        description: Spatial index type (rtree, geohash)

  DatasetWorkingMemoryConfig:
    type: object
    description: Configuration for working memory in datasets
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: true
        description: Whether working memory is enabled
      ttl_seconds:
        type: integer
        default: 3600
        description: Time-to-live for records in seconds
      max_records:
        type: integer
        default: 10000
        description: Maximum records before auto-prune

  StreamingConfig:
    type: object
    description: Configuration for streaming data ingestion
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: false
        description: Whether streaming endpoint is enabled
      batch_size:
        type: integer
        default: 100
        description: Batch size for streaming inserts
      flush_interval_ms:
        type: integer
        default: 1000
        description: Flush interval in milliseconds

  DatasetConsolidationConfig:
    type: object
    description: Configuration for consolidation in datasets
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        default: true
        description: Whether consolidation is enabled
      interval_seconds:
        type: integer
        default: 300
        description: Consolidation interval in seconds
      min_records:
        type: integer
        default: 10
        description: Minimum records before consolidation
      extract_summaries:
        type: boolean
        default: false
        description: Create embeddings from consolidated data
      prune_after:
        type: boolean
        default: true
        description: Prune after consolidation

  ProcessingConfig:
    type: object
    description: Configuration for data processing in datasets
    additionalProperties: false
    required:
      - strategy
    properties:
      strategy:
        type: string
        description: Data processing strategy name
      chunking_size:
        type: integer
        description: Chunk size override
      chunking_overlap:
        type: integer
        description: Chunk overlap override

  Dataset:
    type: object
    description: Dataset configuration - unified container for all storage backends
    required:
      - name
    additionalProperties: false
    properties:
      name:
        type: string
        description: Dataset name
      type:
        $ref: "#/definitions/DatasetType"
      description:
        type: string
        description: Human-readable description

      # New unified configuration (Phase 3)
      vector:
        $ref: "#/definitions/VectorConfig"
      graph:
        $ref: "#/definitions/DatasetGraphConfig"
      timeseries:
        $ref: "#/definitions/DatasetTimeSeriesConfig"
      spatial:
        $ref: "#/definitions/DatasetSpatialConfig"
      working_memory:
        $ref: "#/definitions/DatasetWorkingMemoryConfig"
      streaming:
        $ref: "#/definitions/StreamingConfig"
      consolidation:
        $ref: "#/definitions/DatasetConsolidationConfig"
      processing:
        $ref: "#/definitions/ProcessingConfig"

      # Deprecated but supported for backward compatibility
      data_processing_strategy:
        type: string
        description: "[DEPRECATED] Use processing.strategy instead"
      database:
        type: string
        description: "[DEPRECATED] Use vector.store and vector.collection instead"
      memory:
        type: string
        description: "[DEPRECATED] Use working_memory, timeseries, graph configs instead"
