# yaml-language-server: $schema=http://json-schema.org/draft-07/schema#

$schema: http://json-schema.org/draft-07/schema#
title: LlamaFarm Config
type: object
required:
  - version
  - name
  - namespace
  - runtime
properties:
  version:
    type: string
    enum: ["v1"]
    default: v1
    description: Config version, must be "v1"
  name:
    type: string
    description: Project name
    example: my-project
  namespace:
    type: string
    description: Project namespace
    example: my-namespace
  prompts:
    type: array
    description: List of named prompt sets
    items:
      type: object
      required:
        - name
        - messages
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: "Unique prompt set identifier"
        messages:
          type: array
          description: "List of messages in this prompt set"
          items:
            type: object
            required:
              - content
            properties:
              role:
                type: string
                description: 'Message role (e.g., "system", "user", "assistant")'
              content:
                type: string
                description: "Message content"
          default: []
    default: []

  rag:
    $ref: "../rag/schema.yaml"

  datasets:
    type: array
    description: List of dataset configurations
    items:
      type: object
      required:
        - name
        - files
        - data_processing_strategy
        - database
      properties:
        name:
          type: string
          description: Dataset name
        data_processing_strategy:
          type: string
          description: RAG data processing strategy to use for the dataset
        database:
          type: string
          description: RAG database to use for the dataset
        files:
          type: array
          description: List of file hashes
          items:
            type: string
            description: sha256 of the file content (e.g., "2b3e321d021e5c625a4a003f0624801fa46faab59b530caddcd65a5c106b8a17")
          default: []
    default: []

  runtime:
    type: object
    properties:
      default_model:
        type: string
        description: "Name of the default model to use (references a model name in the models list). If not specified, uses first model."

      models:
        type: array
        description: "List of model configurations for multi-model support"
        items:
          type: object
          required:
            - name
            - provider
            - model
          properties:
            name:
              type: string
              description: "Model identifier (unique name)"
            description:
              type: string
              description: "Human-readable description of this model configuration"
            provider:
              type: string
              enum: [openai, ollama, lemonade, transformers]
              description: "Runtime provider for this model"
            model:
              type: string
              description: "Model name or ID"
            base_url:
              type: string
              description: "Base URL for the provider"
            api_key:
              type: string
              description: "API key for the provider"
            instructor_mode:
              type: string
              description: "Instructor mode to use for structured output (e.g., tools, json, md_json)"
            prompt_format:
              type: string
              enum: [structured, unstructured]
              description: "Prompt formatting pipeline (structured uses Instructor; unstructured sends freeform prompts)"
            model_api_parameters:
              type: object
              description: "Additional parameters passed to the API provider"
              additionalProperties: true
            provider_config:
              type: object
              description: "Provider-specific configuration (e.g., lemonade settings, ollama options)"
              default: {}
              additionalProperties: true
            transformers:
              type: object
              description: "Transformers runtime specific configuration (when provider is 'transformers')"
              properties:
                device:
                  type: string
                  enum: [auto, cuda, mps, cpu]
                  default: auto
                  description: "Device to use for model inference"
                torch_dtype:
                  type: string
                  enum: [auto, float16, float32, bfloat16]
                  default: auto
                  description: "PyTorch dtype for model weights"
                trust_remote_code:
                  type: boolean
                  default: true
                  description: "Allow loading models with custom code from HuggingFace"
                model_type:
                  type: string
                  enum: [text, image]
                  description: "Type of model (text generation or image generation)"
            diffusion:
              type: object
              description: "Diffusion model configuration (for image generation models)"
              properties:
                default_steps:
                  type: integer
                  minimum: 1
                  maximum: 150
                  default: 50
                  description: "Default number of denoising steps"
                default_guidance:
                  type: number
                  minimum: 1.0
                  maximum: 20.0
                  default: 7.5
                  description: "Default guidance scale (how closely to follow the prompt)"
                default_size:
                  type: string
                  enum: ["256x256", "512x512", "768x768", "1024x1024", "1280x1280", "1792x1024", "1024x1792"]
                  default: "1024x1024"
                  description: "Default image size"
                scheduler:
                  type: string
                  enum: [auto, ddim, pndm, lms, euler, euler_a, dpm++]
                  default: auto
                  description: "Diffusion scheduler to use"
                enable_optimizations:
                  type: boolean
                  default: true
                  description: "Enable platform-specific optimizations (attention slicing, xformers, etc.)"
            prompts:
              type: array
              description: "List of prompt set names to use for this model (merged in order)"
              items:
                type: string
              default: []
