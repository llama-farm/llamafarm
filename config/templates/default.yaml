version: v1
name: default-project
namespace: default

# =============================================================================
# RUNTIME CONFIGURATION (required - most important)
# =============================================================================
runtime:
  provider: ollama
  model: llama3.2
  base_url: http://localhost:11434
  temperature: 0.5
  # api_key: optional, not needed for ollama
  # instructor_mode: optional
  # model_api_parameters: optional additional parameters

# =============================================================================
# PROMPTS CONFIGURATION
# =============================================================================
prompts: []

# =============================================================================
# DATASETS CONFIGURATION
# =============================================================================
datasets: []

# =============================================================================
# RAG CONFIGURATION
# =============================================================================
rag:
  # =============================================================================
  # DATABASE CONFIGURATIONS
  # =============================================================================
  databases:
    # Main vector database for general documents
    - name: "main_database"
      type: "ChromaStore"
      config:
        persist_directory: "./data/chroma_db"
        distance_function: "cosine"
        collection_name: "documents"
        port: 8000
      # Default strategies for this database
      default_embedding_strategy: "default_embeddings"
      default_retrieval_strategy: "basic_search"
      # Available embedding strategies
      embedding_strategies:
        - name: "default_embeddings"
          type: "OllamaEmbedder"
          config:
            model: "nomic-embed-text"
            base_url: "http://localhost:11434/"
            dimension: 768
            batch_size: 16
            timeout: 60
            auto_pull: true
        - name: "fast_embeddings"
          type: "OllamaEmbedder"
          config:
            model: "nomic-embed-text"
            base_url: "http://localhost:11434/"
            dimension: 768
            batch_size: 32
            timeout: 30
            auto_pull: true
      # Available retrieval strategies
      retrieval_strategies:
        - name: "basic_search"
          type: "BasicSimilarityStrategy"
          config:
            distance_metric: "cosine"
            top_k: 10
          default: true
        - name: "filtered_search"
          type: "MetadataFilteredStrategy"
          config:
            top_k: 10
            filter_mode: "post"
            fallback_multiplier: 2

  # =============================================================================
  # DATA PROCESSING STRATEGIES
  # =============================================================================
  data_processing_strategies:
    # Basic PDF processing
    - name: "pdf_processing"
      description: "Standard PDF document processing"
      # DirectoryParser configuration (ALWAYS ACTIVE)
      directory_config:
        recursive: true
        include_patterns: ["*.pdf", "*.PDF"]
        exclude_patterns: ["*.tmp", ".*"]
        allowed_mime_types: ["application/pdf"]
        allowed_extensions: [".pdf", ".PDF"]
        max_files: 1000
        follow_symlinks: false
      parsers:
        - type: "PDFParser_PyPDF2"
          config:
            chunk_size: 1000
            chunk_overlap: 150
            chunk_strategy: "paragraphs"
            extract_metadata: true
      extractors:
        - type: "ContentStatisticsExtractor"
          config:
            include_readability: true
            include_vocabulary: true
            include_structure: true
        - type: "EntityExtractor"
          config:
            entity_types: ["PERSON", "ORG", "GPE", "DATE", "PRODUCT"]
            use_fallback: true
            min_entity_length: 2
        - type: "KeywordExtractor"
          config:
            algorithm: "yake"
            max_keywords: 10
            min_keyword_length: 3

    # Basic text processing
    - name: "text_processing"
      description: "Plain text document processing"
      # DirectoryParser configuration
      directory_config:
        recursive: true
        include_patterns: ["*.txt", "*.text", "*.log"]
        exclude_patterns: ["*.tmp", ".*"]
        allowed_mime_types: ["text/plain"]
        allowed_extensions: [".txt", ".text", ".log"]
        max_files: 1000
        follow_symlinks: false
      parsers:
        - type: "TextParser_Python"
          config:
            encoding: "utf-8"
            chunk_size: 1200
            chunk_overlap: 200
            chunk_strategy: "sentences"
            clean_text: true
      extractors:
        - type: "ContentStatisticsExtractor"
          config:
            include_readability: true
            include_vocabulary: true
            include_structure: true
        - type: "EntityExtractor"
          config:
            entity_types: ["PERSON", "ORG", "GPE", "DATE", "PERCENT", "PRODUCT"]
            use_fallback: true
            min_entity_length: 2

    # Markdown processing
    - name: "markdown_processing"
      description: "Markdown document processing with structure preservation"
      # DirectoryParser configuration
      directory_config:
        recursive: true
        include_patterns: ["*.md", "*.markdown", "*.mdown"]
        exclude_patterns: ["*.tmp", ".*", "node_modules/*"]
        allowed_mime_types: ["text/markdown", "text/x-markdown"]
        allowed_extensions: [".md", ".markdown", ".mdown", ".mkd"]
        max_files: 1000
        follow_symlinks: false
      parsers:
        - type: "MarkdownParser_Python"
          config:
            chunk_size: 1000
            chunk_strategy: "sections"
            extract_metadata: true
            extract_code_blocks: true
            extract_links: true
      extractors:
        - type: "ContentStatisticsExtractor"
          config:
            include_readability: true
            include_vocabulary: true
            include_structure: true
        - type: "EntityExtractor"
          config:
            entity_types: ["PERSON", "ORG", "PRODUCT", "CARDINAL", "GPE"]
            use_fallback: true
            min_entity_length: 2

    # CSV/structured data processing
    - name: "csv_processing"
      description: "CSV and structured data processing"
      # DirectoryParser configuration
      directory_config:
        recursive: true
        include_patterns: ["*.csv", "*.tsv"]
        exclude_patterns: ["*.tmp", ".*"]
        allowed_mime_types: ["text/csv", "text/tab-separated-values"]
        allowed_extensions: [".csv", ".tsv", ".CSV", ".TSV"]
        max_files: 500
        follow_symlinks: false
      parsers:
        - type: "CSVParser_Pandas"
          config:
            chunk_size: 500
            chunk_strategy: "rows"
            extract_metadata: true
      extractors:
        - type: "EntityExtractor"
          config:
            entity_types: ["PERSON", "ORG", "GPE", "DATE", "PERCENT"]
            use_fallback: true
            min_entity_length: 2
        - type: "DateTimeExtractor"
          config:
            formats: ["ISO8601", "US", "EU"]
            extract_relative: true

    # Multi-format processing with LlamaIndex parsers
    - name: "multi_format_llamaindex"
      description: "Multi-format document processing using LlamaIndex parsers"
      # DirectoryParser configuration - handles ALL file filtering
      directory_config:
        recursive: true
        include_patterns: ["*"]  # Accept all patterns, filter by mime/extension
        exclude_patterns: ["*.tmp", ".*", "__pycache__/*", "node_modules/*"]
        # File type filtering happens ONLY here
        allowed_mime_types: [
          "application/pdf",
          "text/csv",
          "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
          "text/markdown",
          "text/plain"
        ]
        allowed_extensions: [".pdf", ".csv", ".docx", ".xlsx", ".md", ".txt"]
        max_files: 5000
        follow_symlinks: false
      parsers:
        # PDF parser
        - type: "PDFParser_LlamaIndex"
          mime_types: ["application/pdf"]
          file_extensions: [".pdf", ".PDF"]
          config:
            chunk_strategy: "semantic"
            chunk_size: 1000
            chunk_overlap: 200
            preserve_equations: true
            extract_images: false
            extract_metadata: true
        # CSV parser for structured data
        - type: "CSVParser_LlamaIndex"
          mime_types: ["text/csv", "text/tab-separated-values"]
          file_extensions: [".csv", ".tsv", ".CSV", ".TSV"]
          config:
            chunk_size: 500
            chunk_overlap: 50
            extract_metadata: true
        # Word document parser
        - type: "DocxParser_LlamaIndex"
          mime_types: ["application/vnd.openxmlformats-officedocument.wordprocessingml.document"]
          file_extensions: [".docx", ".DOCX"]
          config:
            chunk_size: 1000
            chunk_overlap: 150
            extract_metadata: true
        # Excel parser
        - type: "ExcelParser_LlamaIndex"
          mime_types: ["application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"]
          file_extensions: [".xlsx", ".XLSX"]
          config:
            chunk_size: 500
            extract_metadata: true
        # Markdown parser
        - type: "MarkdownParser_LlamaIndex"
          mime_types: ["text/markdown", "text/x-markdown"]
          file_extensions: [".md", ".markdown", ".mdown", ".mkd"]
          config:
            chunk_size: 1000
            chunk_overlap: 150
            extract_metadata: true
        # Plain text parser as fallback
        - type: "TextParser_LlamaIndex"
          mime_types: ["text/plain"]
          file_extensions: [".txt", ".text", ".log"]
          config:
            chunk_size: 1000
            chunk_overlap: 150
            extract_metadata: true
      extractors:
        - type: "ContentStatisticsExtractor"
          config:
            include_readability: true
            include_vocabulary: true
            include_structure: true
        - type: "EntityExtractor"
          config:
            entity_types: ["PERSON", "ORG", "GPE", "DATE", "PRODUCT", "MONEY", "PERCENT"]
            use_fallback: true
  
    # Generic text processing (fallback for unknown file types)
    - name: "auto_processing"
      description: "Generic text processing for various file types"
      # DirectoryParser configuration - accepts all files
      directory_config:
        recursive: true
        include_patterns: ["*"]
        exclude_patterns: ["*.tmp", ".*", "*.pyc", "__pycache__/*"]
        # Empty arrays = accept all types
        allowed_mime_types: []
        allowed_extensions: []
        max_files: 1000
        follow_symlinks: false
      parsers:
        - type: "TextParser_Python"
          config:
            chunk_size: 1000
            chunk_overlap: 100
            chunk_strategy: "sentences"
            extract_metadata: true
      extractors:
        - type: "ContentStatisticsExtractor"
          config:
            include_readability: true
            include_vocabulary: true
            include_structure: true
        - type: "EntityExtractor"
          config:
            entity_types: ["PERSON", "ORG", "GPE", "DATE", "PRODUCT"]
            use_fallback: true