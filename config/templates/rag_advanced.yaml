# LlamaFarm RAG Configuration - Advanced Mode
# ============================================
# This configuration uses the full RAG package with advanced features.
# Requires the separate rag/ service to be running.
# Uses heavier dependencies (LlamaIndex, Docling, etc.)
#
# Components:
# - Parser: DoclingParser or LlamaIndex parsers
# - Extractor: EntityExtractor, SummaryExtractor pipeline
# - Vector Store: ChromaDB, Qdrant, or other advanced stores
# - Embedder: HuggingFace, OpenAI, or Cohere
#
# Best for: Complex documents, tables, advanced layouts, power users

rag:
  # Parser configuration
  parser:
    type: "DoclingParser"
    chunk_size: 1000
    chunk_strategy: "hybrid"
    extract_tables: true
    extract_headings: true
    extract_images: false
    ocr_enabled: true
    preserve_layout: true

  # Extractor pipeline
  extractors:
    - type: "EntityExtractor"
      config:
        model: "en_core_web_sm"
        entity_types:
          - "PERSON"
          - "ORG"
          - "GPE"
          - "DATE"
          - "MONEY"
    - type: "SummaryExtractor"
      config:
        max_length: 200
        min_length: 50
    - type: "KeywordExtractor"
      config:
        top_k: 10
        algorithm: "yake"

  # Vector store configuration
  vector_store:
    type: "chromadb"
    mode: "server"  # External ChromaDB server
    host: "localhost"
    port: 8000
    collection_name: "advanced_docs"
    distance_metric: "cosine"

  # Embedder configuration
  embedder:
    type: "sentence_transformers"
    model: "BAAI/bge-base-en-v1.5"
    dimension: 768
    batch_size: 32
    normalize: true

  # Retrieval configuration
  retrieval:
    strategy: "hybrid_universal"
    top_k: 10
    score_threshold: 0.6
    reranker:
      enabled: true
      model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
      top_k: 5
