family_id: qwen3
family_name: Qwen3
organization: Alibaba Cloud
description: Latest Qwen generation with thinking mode, 119 language support, and 36T training tokens
website: https://qwenlm.github.io/blog/qwen3/
license: Apache 2.0
tags: [multilingual, coding, chat, reasoning]
strengths:
  - "Dual-mode: Thinking Mode for complex reasoning, Non-Thinking Mode for quick responses"
  - "Supports 119 languages and dialects"
  - "Trained on 36 trillion tokens (2x Qwen2.5)"
  - "Excellent tool integration and agent capabilities"

# Recommended models for this family
recommended:
  - category: "Small & Fast"
    description: "Efficient models for quick responses and resource-constrained environments"
    models:
      - variant_id: "qwen3:0.6b"
        priority: 1
      - variant_id: "qwen3:1.7b"
        priority: 2

  - category: "Balanced"
    description: "Best balance of performance and resource usage"
    models:
      - variant_id: "qwen3:4b"
        priority: 1

  - category: "Powerful"
    description: "Maximum capability for complex tasks"
    models:
      - variant_id: "qwen3:8b"
        priority: 1

variants:
  - id: qwen3:0.6b
    display_name: "Qwen3 0.6B"
    description: "Ultra-compact multilingual model with thinking mode"
    parameters: "0.6b"
    download_size: "1.2 GB"
    context_window: 32768
    hardware_requirements:
      min_ram: "4 GB"
      min_vram: "2 GB"
      recommended_gpu: ["Apple M1", "NVIDIA GTX 1660", "CPU-only"]
    providers:
      universal:
        provider: universal
        runtime: universal
        format: transformers
        model_id: "Qwen/Qwen3-0.6B"
        base_url: "http://127.0.0.1:11540"
        download_command: "Auto-downloads from HuggingFace on first use"
        notes: "Supports thinking mode. Set HF_TOKEN for gated models."
      ollama:
        provider: ollama
        runtime: ollama
        format: gguf
        model_id: "qwen3:0.6b"
        base_url: "http://localhost:11434"
        download_command: "ollama pull qwen3:0.6b"
        notes: "GGUF quantized for efficient local inference"
      lemonade:
        provider: lemonade
        runtime: lemonade
        format: gguf
        backend: llamacpp
        model_id: "user.Qwen3-0.6B"
        checkpoint: "unsloth/Qwen3-0.6B-GGUF"
        recipe: "llamacpp"
        download_command: "uv run lemonade-server-dev pull user.Qwen3-0.6B --checkpoint unsloth/Qwen3-0.6B-GGUF --recipe llamacpp"
        notes: "Hardware-optimized (NPU/GPU). Start with: LEMONADE_MODEL=user.Qwen3-0.6B nx start lemonade"
    use_cases: [chat, lightweight-inference, multilingual]

