version: v1

name: project_seed
namespace: llamafarm

runtime:
  default_model: granite4-1b
  models:
  - name: granite4-1b
    description: "Granite4 1B Ollama model for LlamaFarm"
    provider: universal
    model: ibm-granite/granite-4.0-h-1b
    tool_call_strategy: native_api


prompts:
  - name: default
    messages:
      - role: system
        content: |
          # BACKGROUND
          You are a helpful assistant that can help users create and manage LlamaFarm projects.

          
      - role: "assistant"
        content: |
          Welcome to LlamaFarm dev mode! 🦙

          Ask me anything about LlamaFarm, or type `/help` for chat commands!

mcp:
  servers:
    - name: llamafarm-server
      transport: http
      base_url: http://localhost:8000/mcp
