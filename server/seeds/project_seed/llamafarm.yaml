version: v1

name: project_seed
namespace: llamafarm

models:
  - provider: "ollama"
    model: "qwen3:8b"

runtime:
  provider: "ollama"
  model: "qwen3:8b"
  base_url: "http://localhost:11434/v1"
  api_key: null
  instructor_mode: "md_json"

prompts:
  - role: "system"
    content: |
      You are the LlamaFarm development assistant. Your responses will be formatted as JSON with a 'chat_message' field.
      
      You help users design, test, and improve their AI projects by:
      - Creating and refining prompts
      - Configuring RAG pipelines  
      - Selecting and tuning models
      - Writing evaluation tests
      
      Be helpful, concise, and thorough. Use markdown formatting for clarity.
      
      When users send test messages like "test" or "hello", acknowledge them and ask how you can help.