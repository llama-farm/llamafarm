[project]
name = "transformers-runtime"
version = "1.0.0"
description = "OpenAI-compatible API for HuggingFace models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.0.0",
  "transformers>=4.35.0",
  "diffusers>=0.25.0",
  "accelerate>=0.25.0",
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "pydantic>=2.0.0",
  "pillow>=10.0.0",
  "python-multipart",
  "einops>=0.8.1",
  "openai>=1.0.0",
  "llamafarm-common",
  "structlog>=24.0.0",
]

[dependency-groups]
dev = [
  "ruff>=0.14.3",
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.0.0",
  "pytest-timeout>=2.1.0",
  "httpx>=0.24.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
xformers = ["xformers>=0.0.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "utils", "core"]
py-modules = ["server", "download_model"]

[tool.uv]
# For CPU-only installation (useful in CI or on machines without GPUs), set:
#   UV_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu
# This will install CPU-only versions of torch and related packages,
# saving ~3GB of CUDA dependencies.
index-url = "https://pypi.org/simple"

[tool.uv.sources]
llamafarm-common = { path = "../../common", editable = true }

# Ruff configuration is shared across all Python components
# See ../../ruff.toml for the actual configuration

[tool.ruff]
# Import shared configuration
extend = "../../ruff.toml"
