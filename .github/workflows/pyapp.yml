name: Build Native Binaries (PyApp)

# POC: Build standalone server binary using PyApp
# This is an alternative to the Nuitka build pipeline.
# PyApp produces a Rust binary that bootstraps Python + deps on first run.

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component to build"
        required: true
        default: "server"
        type: choice
        options:
          - server
      embed_python:
        description: "Embed Python distribution in binary"
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - "tools/pyapp/**"
      - ".github/workflows/pyapp.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_SYSTEM_PYTHON: 1

jobs:
  build:
    name: Build ${{ matrix.component }} on ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x86_64
            runner: ubuntu-latest
            component: server
          - os: linux-arm64
            runner: ubuntu-24.04-arm
            component: server
          - os: macos-arm64
            runner: macos-latest
            component: server
          - os: windows-x86_64
            runner: windows-latest
            component: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/pyapp/.cache/**/target
          key: cargo-pyapp-${{ matrix.os }}-${{ hashFiles('tools/pyapp/**') }}
          restore-keys: |
            cargo-pyapp-${{ matrix.os }}-

      - name: Install component dependencies
        run: |
          uv pip install --system -e ./config -e ./common -e ./server

      - name: Generate config types
        run: |
          cd config && python generate_types.py

      - name: Build with PyApp
        run: |
          python tools/pyapp/build.py --skip-types ${{ github.event.inputs.embed_python == 'false' && '--no-embed-python' || '' }}

      - name: List build output
        shell: bash
        run: |
          echo "Build output:"
          ls -la dist/pyapp/ || echo "No output found"

      - name: Test binary runs
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BINARY=$(ls dist/pyapp/llamafarm-server-*.exe)
          else
            chmod +x dist/pyapp/llamafarm-server-*
            BINARY=$(ls dist/pyapp/llamafarm-server-*)
          fi

          echo "Testing self commands..."
          # self --help should work without bootstrapping
          timeout 30 "$BINARY" self --help || true

          echo "Binary executed successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llamafarm-server-pyapp-${{ matrix.os }}
          path: dist/pyapp/llamafarm-server-*
          retention-days: 7
          if-no-files-found: error
