name: E2E Test Results (Post PR Comments)

# Security: This workflow runs in trusted context (base repository)
# Has access to secrets and write permissions to post PR comments
permissions:
  contents: read
  pull-requests: write
  actions: read # Required to download artifacts from other workflows

on:
  workflow_run:
    workflows: ["E2E Tests (Fork PR)"]
    types: [completed]

jobs:
  post-results:
    name: Post E2E Test Results
    runs-on: ubuntu-latest
    # Only run if the triggering workflow completed (success or failure)
    if: ${{ github.event.workflow_run.event == 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download PR metadata artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ${{ github.event.workflow_run.id }}
          name: pr-info
          path: pr-info/
          if_no_artifact_found: warn

      - name: Download test logs artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ${{ github.event.workflow_run.id }}
          pattern: "e2e-test-logs-*"
          path: test-logs/
          if_no_artifact_found: warn
          merge-multiple: true

      - name: Read PR metadata
        id: pr-info
        shell: bash
        run: |
          if [ -f "pr-info/pr-info.json" ]; then
            PR_NUMBER=$(jq -r '.pr_number' pr-info/pr-info.json)
            HEAD_SHA=$(jq -r '.head_sha' pr-info/pr-info.json)
            BASE_SHA=$(jq -r '.base_sha' pr-info/pr-info.json)
            HEAD_REF=$(jq -r '.head_ref' pr-info/pr-info.json)
            HEAD_REPO=$(jq -r '.head_repo' pr-info/pr-info.json)
            BASE_REPO=$(jq -r '.base_repo' pr-info/pr-info.json)
            WORKFLOW_RUN_URL=$(jq -r '.workflow_run_url' pr-info/pr-info.json)
            
            echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
            echo "head_sha=${HEAD_SHA}" >> $GITHUB_OUTPUT
            echo "base_sha=${BASE_SHA}" >> $GITHUB_OUTPUT
            echo "head_ref=${HEAD_REF}" >> $GITHUB_OUTPUT
            echo "head_repo=${HEAD_REPO}" >> $GITHUB_OUTPUT
            echo "base_repo=${BASE_REPO}" >> $GITHUB_OUTPUT
            echo "workflow_run_url=${WORKFLOW_RUN_URL}" >> $GITHUB_OUTPUT
            
            echo "✓ PR metadata loaded: PR #${PR_NUMBER}"
          else
            echo "⚠ Warning: PR metadata artifact not found"
            echo "pr_number=" >> $GITHUB_OUTPUT
          fi

      - name: Get workflow run conclusion
        id: workflow-conclusion
        shell: bash
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          echo "conclusion=${CONCLUSION}" >> $GITHUB_OUTPUT
          echo "Workflow conclusion: ${CONCLUSION}"

      - name: Build test results summary
        id: build-summary
        shell: bash
        run: |
          CONCLUSION="${{ steps.workflow-conclusion.outputs.conclusion }}"
          WORKFLOW_RUN_URL="${{ steps.pr-info.outputs.workflow_run_url }}"
          WORKFLOW_RUN_ID="${{ github.event.workflow_run.id }}"
          
          # Determine status emoji and message
          if [ "$CONCLUSION" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="**All E2E tests passed!**"
          elif [ "$CONCLUSION" = "failure" ]; then
            STATUS_EMOJI="❌"
            STATUS_TEXT="**E2E tests failed**"
          elif [ "$CONCLUSION" = "cancelled" ]; then
            STATUS_EMOJI="⚠️"
            STATUS_TEXT="**E2E tests were cancelled**"
          else
            STATUS_EMOJI="❓"
            STATUS_TEXT="**E2E tests completed with status: ${CONCLUSION}**"
          fi
          
          # Build the comment body
          COMMENT_BODY="${STATUS_EMOJI} ${STATUS_TEXT}

          ### Test Results Summary
          
          - **Workflow Run**: [View Details](${WORKFLOW_RUN_URL})
          - **Workflow ID**: \`${WORKFLOW_RUN_ID}\`
          - **Status**: \`${CONCLUSION}\`
          
          "
          
          # Add log information if available
          if [ -d "test-logs" ] && [ "$(ls -A test-logs)" ]; then
            COMMENT_BODY="${COMMENT_BODY}
          ### 📋 Test Logs Available
          
          Test logs have been uploaded as workflow artifacts. You can download them from the [workflow run page](${WORKFLOW_RUN_URL}).
          "
          fi
          
          COMMENT_BODY="${COMMENT_BODY}
          
          ---
          *This comment was automatically generated by the E2E Test Results workflow.*"
          
          # Save to file for github-script
          echo "$COMMENT_BODY" > comment-body.txt
          echo "Comment body prepared:"
          echo "$COMMENT_BODY"

      - name: Find existing comment
        id: find-comment
        if: steps.pr-info.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr-info.outputs.pr_number }};
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            // Find comment from this bot (contains the marker)
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('*This comment was automatically generated by the E2E Test Results workflow.*')
            );
            
            if (botComment) {
              core.setOutput('comment_id', botComment.id);
              core.setOutput('exists', 'true');
              console.log(`Found existing comment: ${botComment.id}`);
            } else {
              core.setOutput('exists', 'false');
              console.log('No existing comment found');
            }

      - name: Post or update PR comment
        if: steps.pr-info.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = ${{ steps.pr-info.outputs.pr_number }};
            const commentBody = fs.readFileSync('comment-body.txt', 'utf8');
            const commentExists = '${{ steps.find-comment.outputs.exists }}' === 'true';
            const existingCommentId = ${{ steps.find-comment.outputs.comment_id }};
            
            if (commentExists && existingCommentId) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingCommentId,
                body: commentBody
              });
              console.log(`✅ Updated existing comment #${existingCommentId} on PR #${prNumber}`);
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
              console.log(`✅ Created new comment on PR #${prNumber}`);
            }

      - name: Handle missing PR metadata
        if: steps.pr-info.outputs.pr_number == ''
        run: |
          echo "⚠️ Warning: Could not post PR comment because PR metadata was not found."
          echo "This may happen if the workflow was triggered manually or the artifact upload failed."
          echo "Workflow run: ${{ github.event.workflow_run.html_url }}"

