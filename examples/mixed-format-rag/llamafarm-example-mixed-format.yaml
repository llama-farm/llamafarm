version: v1
name: mixed-format-demo
namespace: default

runtime:
  provider: ollama
  model: llama3.1:8b
  base_url: http://localhost:11434/v1
  temperature: 0.2
  agent_handler: simple_rag

prompts:
  - role: system
    content: |
      You are a technical analyst that reviews mixed-format project documentation.
      Cite file names and sections when summarizing information. If the context lacks the answer, say so.

rag:
  databases:
    - name: mixed_format_db
      type: ChromaStore
      config:
        collection_name: mixed_format_docs
        distance_function: cosine
        persist_directory: ./data/mixed_format_db
        port: 8000
      embedding_strategies:
        - name: default_embeddings
          type: OllamaEmbedder
          config:
            auto_pull: true
            base_url: http://localhost:11434
            batch_size: 16
            dimension: 768
            model: nomic-embed-text
            timeout: 60
          priority: 0
      retrieval_strategies:
        - name: blended_search
          type: HybridUniversalStrategy
          config:
            dense_weight: 0.6
            sparse_weight: 0.4
            top_k: 8
          default: true
  data_processing_strategies:
    - name: mixed_content_processor
      description: Handles PDFs, text, Markdown, HTML, and code snippets.
      parsers:
        - type: PDFParser_LlamaIndex
          file_include_patterns: ['*.pdf', '*.PDF']
          priority: 120
          config:
            chunk_size: 1000
            chunk_overlap: 120
            extract_metadata: true
        - type: MarkdownParser_LlamaIndex
          file_include_patterns: ['*.md', '*.markdown']
          priority: 110
          config:
            chunk_size: 800
            chunk_overlap: 80
        - type: TextParser_LlamaIndex
          file_include_patterns: ['*.txt']
          priority: 100
          config:
            chunk_size: 800
            chunk_overlap: 80
        - type: TextParser_Python
          file_include_patterns: ['*.html', '*.py']
          priority: 90
          config:
            chunk_size: 600
            chunk_overlap: 60
      extractors:
        - type: ContentStatisticsExtractor
          priority: 100
          config:
            include_readability: true
            include_structure: true
        - type: EntityExtractor
          priority: 90
          config:
            entity_types: [ORG, PERSON, PRODUCT, DATE]
            use_fallback: true

datasets:
  - name: mixed_format_seed
    database: mixed_format_db
    data_processing_strategy: mixed_content_processor
    files: []
