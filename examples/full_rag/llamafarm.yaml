version: v1
name: full_rag
namespace: default
description: "Full RAG - Advanced features with Docling parser and complex retrieval"

runtime:
  models:
    - name: llama
      description: "LLaMA model for advanced RAG"
      provider: ollama
      model: llama3.1:8b
      base_url: http://localhost:11434
      default: true
      prompt_format: unstructured

prompts:
  - name: default
    messages:
      - role: system
        content: |
          You are an expert assistant. Provide detailed, well-researched answers
          based on the provided context. Always cite your sources.

rag:
  databases:
    - name: advanced_docs
      type: ChromaStore
      config:
        collection_name: advanced_documents
        distance_function: cosine
        persist_directory: ./data/full_rag
        # Can also use Qdrant, Milvus, etc. for advanced RAG
      embedding_strategies:
        - name: nomic_embeddings
          type: OllamaEmbedder
          config:
            model: nomic-embed-text
            dimension: 768
            batch_size: 16
            timeout: 120
            api_base: http://localhost:11434
            auto_pull: true
          priority: 0
        - name: universal_fallback
          type: UniversalEmbedder
          config:
            model: sentence-transformers/all-MiniLM-L6-v2
            dimension: 384
            batch_size: 32
            timeout: 60
            api_base: http://127.0.0.1:11540
          priority: 1
      retrieval_strategies:
        - name: advanced_search
          type: HybridRetrievalStrategy  # Advanced: combines multiple strategies
          config:
            strategies:
              - type: BasicSimilarityStrategy
                weight: 0.7
                config:
                  distance_metric: cosine
                  top_k: 10
              - type: KeywordSearchStrategy
                weight: 0.3
                config:
                  top_k: 10
            top_k: 5
            rerank: true
          default: true
        - name: simple_search
          type: BasicSimilarityStrategy
          config:
            distance_metric: cosine
            similarity_threshold: 0.5
            top_k: 5
          default: false
      default_embedding_strategy: nomic_embeddings
      default_retrieval_strategy: advanced_search

  data_processing_strategies:
    - name: advanced_parser
      description: "Advanced parsing with Docling for PDFs + LlamaIndex for various formats"
      parsers:
        # Docling for high-quality PDF parsing (when implemented)
        - type: DoclingParser
          file_include_patterns:
            - "*.pdf"
          priority: 100
          config:
            extract_tables: true
            extract_images: true
            preserve_layout: true
            chunk_size: 1500
            chunk_overlap: 200
        # LlamaIndex parsers for other formats
        - type: MarkdownParser_LlamaIndex
          file_include_patterns:
            - "*.md"
          priority: 90
          config:
            chunk_size: 1000
            chunk_overlap: 150
        - type: TextParser_LlamaIndex
          file_include_patterns:
            - "*.txt"
          priority: 80
          config:
            chunk_size: 1000
            chunk_overlap: 150
      extractors:
        # Advanced extractors
        - type: YAKEKeywordExtractor
          file_include_patterns:
            - "*"
          priority: 100
          config:
            max_keywords: 20
            language: en
        - type: GLiNEREntityExtractor
          file_include_patterns:
            - "*"
          priority: 90
          config:
            entity_types:
              - person
              - organization
              - location
              - date
        - type: ContentStatisticsExtractor
          file_include_patterns:
            - "*"
          priority: 80
          config:
            include_readability: true
            include_complexity: true

datasets:
  - name: research_papers
    data_processing_strategy: advanced_parser
    database: advanced_docs
