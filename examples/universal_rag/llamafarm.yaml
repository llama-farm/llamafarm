version: v1
name: universal_rag
namespace: default
description: "Universal RAG - Built-in lightweight RAG using MarkItDown parser"

runtime:
  models:
    - name: qwen
      description: "Default model for RAG queries"
      provider: universal
      model: unsloth/Qwen3-1.7B-GGUF:Q4_K_M
      base_url: http://127.0.0.1:11540
      default: true
      prompt_format: unstructured

prompts:
  - name: default
    messages:
      - role: system
        content: |
          You are a helpful assistant. Answer questions based on the provided context.
          Be concise and cite sources when possible.

rag:
  databases:
    - name: universal_docs
      type: ChromaStore
      config:
        collection_name: universal_documents
        distance_function: cosine
        persist_directory: ./data/universal_rag
        # No port = embedded mode (default for universal RAG)
      embedding_strategies:
        - name: universal_embeddings
          type: UniversalEmbedder
          config:
            model: sentence-transformers/all-MiniLM-L6-v2
            dimension: 384
            batch_size: 32
            timeout: 60
            api_base: http://127.0.0.1:11540
            auto_pull: true
          priority: 0
      retrieval_strategies:
        - name: basic_search
          type: BasicSimilarityStrategy
          config:
            distance_metric: cosine
            similarity_threshold: 0.0
            top_k: 5
          default: true
      default_embedding_strategy: universal_embeddings
      default_retrieval_strategy: basic_search

  data_processing_strategies:
    - name: universal_parser
      description: "Universal parser using MarkItDown (PDF, DOCX, HTML, etc.)"
      parsers:
        - type: MarkItDownParser
          file_include_patterns:
            - "*.pdf"
            - "*.docx"
            - "*.pptx"
            - "*.xlsx"
            - "*.html"
            - "*.htm"
            - "*.md"
            - "*.txt"
          priority: 100
          config:
            chunk_size: 1000
            chunk_overlap: 100
            universal_runtime_url: http://127.0.0.1:11540  # For OCR fallback
      extractors:
        - type: ContentStatisticsExtractor
          file_include_patterns:
            - "*"
          priority: 80
          config:
            include_readability: true

datasets:
  - name: documents
    data_processing_strategy: universal_parser
    database: universal_docs
