version: v1
name: quick-rag-demo
namespace: default

runtime:
  provider: ollama
  model: llama3.1:8b
  base_url: http://localhost:11434/v1
  temperature: 0.2
  agent_handler: simple_rag

prompts:
  - role: system
    content: |
      You are a concise engineering assistant. Answer in short paragraphs and cite file names when possible.

rag:
  databases:
    - name: quick_rag_db
      type: ChromaStore
      config:
        collection_name: quick_rag_documents
        distance_function: cosine
        persist_directory: ./data/quick_rag_db
        port: 8000
      embedding_strategies:
        - name: default_embeddings
          type: OllamaEmbedder
          config:
            auto_pull: true
            base_url: http://localhost:11434
            batch_size: 8
            dimension: 768
            model: nomic-embed-text
            timeout: 60
          priority: 0
      retrieval_strategies:
        - name: quick_search
          type: BasicSimilarityStrategy
          config:
            distance_metric: cosine
            top_k: 5
          default: true
  data_processing_strategies:
    - name: quick_note_processor
      description: Lightweight processor for short engineering notes.
      parsers:
        - type: MarkdownParser_LlamaIndex
          file_include_patterns: ['*.md']
          priority: 100
          config:
            chunk_size: 400
            chunk_overlap: 40
        - type: TextParser_LlamaIndex
          file_include_patterns: ['*.txt']
          priority: 90
          config:
            chunk_size: 400
            chunk_overlap: 40
      extractors:
        - type: ContentStatisticsExtractor
          priority: 80
          config:
            include_readability: true

## datasets section left intentionally empty users run script.
